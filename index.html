<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🛢️ بی‌بی روغن - نسخه نهایی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,sans-serif;overscroll-behavior:none}
#gameCanvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:1}
#hud{position:fixed;top:0;left:0;right:0;padding:6px 8px;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:12px;color:#fff}
.hud-box{background:rgba(0,0,0,.8);border:2px solid rgba(255,215,0,.5);border-radius:10px;padding:5px 9px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
#healthWrap{width:120px;height:14px;background:rgba(0,0,0,.6);border:2px solid #8a1a1a;border-radius:7px;overflow:hidden;position:relative}
#healthFill{height:100%;background:linear-gradient(90deg,#ff3030,#ff6b6b);transition:width .2s;width:100%}
#healthText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;text-shadow:0 1px 2px #000}
#manaWrap{width:120px;height:8px;background:rgba(0,0,0,.6);border:2px solid #1a5a8a;border-radius:4px;overflow:hidden;margin-top:3px}
#manaFill{height:100%;background:linear-gradient(90deg,#4aa8d0,#7fe3ff);width:100%;transition:width .2s}
#bossBar{position:fixed;top:52px;left:50%;transform:translateX(-50%);width:min(80vw,500px);height:22px;background:rgba(0,0,0,.85);border:3px solid #ff3030;border-radius:12px;overflow:hidden;z-index:12;display:none;box-shadow:0 0 30px rgba(255,0,0,.6)}
#bossBar.show{display:block;animation:pulseBoss 1s ease-in-out infinite}
@keyframes pulseBoss{0%,100%{box-shadow:0 0 30px rgba(255,0,0,.6)}50%{box-shadow:0 0 50px rgba(255,0,0,1)}}
#bossFill{height:100%;background:linear-gradient(90deg,#8a0000,#ff3030,#ff6b6b);transition:width .2s;width:100%}
#bossText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:bold;text-shadow:0 2px 4px #000}
.hud-num{color:#ffd700;font-weight:bold}
#joystick{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,215,0,.7);background:rgba(0,0,0,.4);opacity:0;pointer-events:none;z-index:25;transition:opacity .15s;box-shadow:0 0 25px rgba(255,215,0,.5)}
#joystick.active{opacity:1}
#joyKnob{position:absolute;width:55px;height:55px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe066,#ffb700);border:3px solid #7a5228;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(0,0,0,.6)}
.btn{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.6);border:3px solid;transition:transform .1s;z-index:30;touch-action:none}
.btn:active{transform:scale(.9)}
#attackBtn{right:18px;bottom:150px;width:80px;height:80px;background:radial-gradient(circle at 30% 30%,#ff9e4a,#e67520);border-color:#7a3a00}
#attackBtn::after{content:'🛢️';font-size:38px}
#voiceBtn{right:18px;bottom:55px;width:70px;height:70px;background:radial-gradient(circle at 30% 30%,#7ed6a0,#3aa76d);border-color:#1a6a3a}
#voiceBtn::after{content:'🎤';font-size:32px}
#voiceBtn.listening{animation:pulseMic .8s infinite;background:radial-gradient(circle at 30% 30%,#ff3030,#a00000)}
@keyframes pulseMic{0%,100%{transform:scale(1)}50%{transform:scale(1.15);box-shadow:0 0 30px rgba(255,0,0,.9)}}
#shopBtn{right:115px;bottom:55px;width:62px;height:62px;background:radial-gradient(circle at 30% 30%,#c8a8f0,#8a6ac8);border-color:#3a1a5a;font-size:30px}
#shopBtn::after{content:'🏪'}
#itemBtn{right:115px;bottom:130px;width:58px;height:58px;background:radial-gradient(circle at 30% 30%,#ffe066,#e6a800);border-color:#7a4a00;font-size:26px;display:none}
#itemBtn.show{display:flex}
#itemBtn::after{content:'💊'}
#itemBtn .count{position:absolute;top:-6px;right:-6px;background:#ff3030;color:#fff;font-size:11px;font-weight:bold;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#soundBtn{top:10px;right:10px;width:40px;height:40px;font-size:18px;background:radial-gradient(circle at 30% 30%,#ffe066,#ffb700);border-color:#7a5228;z-index:40}
#soundBtn.off{background:radial-gradient(circle at 30% 30%,#888,#555);border-color:#333}
#menuBtn{top:10px;left:10px;width:40px;height:40px;font-size:18px;background:radial-gradient(circle at 30% 30%,#7fd4f0,#3a8ac8);border-color:#1a4a88;z-index:40}
#achBtn{top:10px;left:60px;width:40px;height:40px;font-size:18px;background:radial-gradient(circle at 30% 30%,#ffd700,#e6a800);border-color:#7a4a00;z-index:40}
#achBtn::after{content:'🎖️'}
#scoreBtn{top:10px;left:110px;width:40px;height:40px;font-size:18px;background:radial-gradient(circle at 30% 30%,#ff8ac4,#c85888);border-color:#8a2848;z-index:40}
#scoreBtn::after{content:'🏆'}
#menuPanel{position:fixed;top:56px;left:10px;z-index:50;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(-10px);pointer-events:none;transition:all .3s}
#menuPanel.show{opacity:1;transform:translateY(0);pointer-events:auto}
#menuPanel button{padding:9px 14px;font-family:inherit;font-size:13px;font-weight:bold;color:#fff;background:rgba(40,20,10,.95);border:2px solid rgba(255,200,100,.6);border-radius:10px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.5);white-space:nowrap}
#dialog{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);background:rgba(2,10,22,.95);border:3px solid #ffd700;border-radius:14px;padding:10px 18px;color:#fff;font-size:14px;font-weight:bold;text-align:center;max-width:88vw;min-width:180px;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 0 30px rgba(255,215,0,.5)}
#dialog.show{opacity:1}
#dialog::before{content:attr(data-speaker);position:absolute;top:-12px;right:14px;background:#ffd700;color:#3a1a00;padding:2px 10px;border-radius:8px;font-size:11px}
#minimap{position:fixed;top:56px;right:10px;width:100px;height:80px;background:rgba(0,0,0,.6);border:2px solid rgba(255,215,0,.5);border-radius:8px;z-index:15;overflow:hidden;pointer-events:none}
#minimapCanvas{width:100%;height:100%;display:block}
#levelInfo{position:fixed;top:56px;left:10px;z-index:11;background:rgba(0,0,0,.75);border:2px solid rgba(255,215,0,.5);border-radius:10px;padding:5px 10px;color:#fff;font-size:12px;font-weight:bold;display:none;pointer-events:none}
#levelInfo.show{display:block}
#autoHuntIndicator{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(255,60,0,.9);border:3px solid #ffd700;border-radius:12px;padding:6px 16px;color:#fff;font-size:13px;font-weight:bold;display:none;animation:pulseHunt 1s ease-in-out infinite;pointer-events:none}
#autoHuntIndicator.show{display:block}
@keyframes pulseHunt{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:150;display:none;flex-direction:column;color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:12px 12px 90px}
.panel.show{display:flex}
.panel h2{font-size:20px;text-align:center;color:#ffd700;margin-bottom:8px;text-shadow:0 0 20px rgba(255,215,0,.7);position:sticky;top:0;background:rgba(0,0,0,.96);padding:8px 0;z-index:2}
.panel-coins{text-align:center;font-size:16px;color:#ffe066;margin-bottom:10px;font-weight:bold}
.tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;position:sticky;top:44px;background:rgba(0,0,0,.96);padding:6px 0;z-index:2}
.tab{padding:7px 12px;background:rgba(60,40,20,.8);border:2px solid rgba(255,200,100,.4);border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;touch-action:manipulation;color:#fff}
.tab.active{background:linear-gradient(180deg,#ffe066,#ffb700);color:#3a1a00}
#shopItems{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.shop-item{background:rgba(40,20,60,.85);border:2px solid rgba(255,200,100,.4);border-radius:12px;padding:8px;text-align:center}
.shop-item.owned{border-color:#4ade80}
.shop-item.equipped{border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.6)}
.shop-item .icon{font-size:32px;margin-bottom:2px}
.shop-item .name{font-size:12px;font-weight:bold;margin-bottom:3px}
.shop-item .desc{font-size:9px;color:#bbb;margin-bottom:5px;line-height:1.3}
.shop-item .price{font-size:11px;color:#ffe066;font-weight:bold;margin-bottom:5px}
.shop-item button{width:100%;padding:6px;font-family:inherit;font-size:11px;font-weight:bold;color:#fff;background:rgba(120,60,200,.9);border:2px solid rgba(255,255,255,.3);border-radius:7px;cursor:pointer;touch-action:manipulation}
.shop-item button:disabled{background:rgba(60,60,60,.9);cursor:not-allowed}
.close-panel-btn{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:12px 40px;font-family:inherit;font-size:15px;font-weight:bold;color:#3a1a00;background:linear-gradient(180deg,#ffe066,#ffb700);border:3px solid #7a5228;border-radius:14px;cursor:pointer;box-shadow:0 6px 20px rgba(255,180,0,.5);z-index:151;touch-action:manipulation}
.fs-screen{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff;gap:12px;transition:opacity .5s;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fs-screen.hide{opacity:0;pointer-events:none}
#startScreen .big{font-size:70px;animation:bounce 1.5s infinite alternate}
@keyframes bounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-15px) rotate(5deg)}}
#startScreen h1{font-size:22px;background:linear-gradient(45deg,#ffd700,#ff9e4a,#ff6b9d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#startScreen p{font-size:13px;color:#ccc;line-height:1.7;max-width:340px}
.start-btn{padding:14px 40px;font-size:18px;font-weight:bold;font-family:inherit;color:#3a1a00;background:linear-gradient(180deg,#ffe066,#ffb700);border:4px solid #7a5228;border-radius:18px;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 20px rgba(255,180,0,.5)}
.sec-btn{padding:10px 24px;font-size:14px;font-weight:bold;font-family:inherit;color:#fff;background:linear-gradient(180deg,#7fd4f0,#3a8ac8);border:3px solid #1a4a88;border-radius:14px;cursor:pointer;touch-action:manipulation;margin:4px}
#levelEndScreen .big{font-size:70px}
#levelEndScreen h1{font-size:24px;color:#ffd700}
#levelEndScreen .stat{font-size:16px;margin:3px}
#levelEndScreen button{padding:12px 26px;font-family:inherit;font-size:15px;font-weight:bold;color:#3a1a00;background:linear-gradient(180deg,#ffe066,#ffb700);border:3px solid #7a5228;border-radius:12px;cursor:pointer;margin:3px;touch-action:manipulation}
.char-select{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.char-card{padding:12px;background:rgba(255,255,255,.1);border:3px solid rgba(255,215,0,.4);border-radius:14px;cursor:pointer;min-width:100px;transition:.2s}
.char-card.selected{border-color:#ffd700;background:rgba(255,215,0,.2);box-shadow:0 0 20px rgba(255,215,0,.6)}
.char-card .emoji{font-size:40px}
.char-card .name{font-size:13px;font-weight:bold;margin-top:4px}
.char-card .desc{font-size:10px;color:#bbb;margin-top:2px}
.achievement-item{background:rgba(255,255,255,.08);border:2px solid rgba(255,215,0,.4);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.achievement-item.unlocked{border-color:#4ade80;background:rgba(74,222,128,.15)}
.achievement-item .ach-icon{font-size:32px}
.achievement-item .ach-info{flex:1;text-align:right}
.achievement-item .ach-name{font-size:14px;font-weight:bold;margin-bottom:3px}
.achievement-item .ach-desc{font-size:11px;color:#bbb}
.achievement-item .ach-status{font-size:12px;color:#4ade80;font-weight:bold}
.achievement-item.locked .ach-name{color:#888}
.achievement-item.locked .ach-status{color:#888}
.score-item{background:rgba(255,255,255,.08);border:2px solid rgba(255,215,0,.4);border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px}
.score-item .rank{font-size:20px;font-weight:bold;color:#ffd700;width:40px}
.score-item .info{flex:1;text-align:right}
.score-item .val{font-size:16px;font-weight:bold;color:#ffe066}
@media (max-aspect-ratio:3/4){
  #attackBtn{width:72px;height:72px;bottom:140px}
  #voiceBtn{width:64px;height:64px;bottom:55px}
  #shopBtn{right:105px;bottom:55px;width:58px;height:58px}
  #itemBtn{right:105px;bottom:128px;width:54px;height:54px}
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div>
    <div class="hud-box">
      <div id="healthWrap"><div id="healthFill"></div><div id="healthText">❤️ 100/100</div></div>
      <div id="manaWrap"><div id="manaFill"></div></div>
    </div>
  </div>
  <div class="hud-box">🪙 <span class="hud-num" id="coinsVal">0</span></div>
</div>

<div id="bossBar"><div id="bossFill"></div><div id="bossText">👹 اژدهای روغن</div></div>

<div id="levelInfo">مرحله <span id="levelNum">1</span> - <span id="levelGoal">0/6</span></div>
<div id="autoHuntIndicator">🔥 حالت شکار خودکار فعال!</div>
<div id="minimap"><canvas id="minimapCanvas" width="200" height="160"></canvas></div>
<div id="joystick"><div id="joyKnob"></div></div>

<div class="btn" id="attackBtn"></div>
<div class="btn" id="voiceBtn"></div>
<div class="btn" id="shopBtn"></div>
<div class="btn" id="itemBtn"><span class="count" id="itemCount">0</span></div>
<div class="btn" id="soundBtn">🔊</div>
<div class="btn" id="menuBtn">☰</div>
<div class="btn" id="achBtn"></div>
<div class="btn" id="scoreBtn"></div>

<div id="menuPanel">
  <button id="btnHelp">📖 راهنما</button>
  <button id="btnVoiceCmd">🎤 دستورات</button>
  <button id="btnAch">🎖️ دستاوردها</button>
  <button id="btnScore">🏆 امتیازات</button>
  <button id="btnReset">🔄 ریست</button>
</div>

<div id="dialog" data-speaker="بی‌بی روغن"></div>

<div class="panel" id="shopScreen">
  <h2>🏪 فروشگاه بی‌بی روغن</h2>
  <div class="panel-coins">🪙 <span id="shopCoinsVal">0</span></div>
  <div class="tabs">
    <div class="tab active" data-tab="weapons">🗡️ سلاح</div>
    <div class="tab" data-tab="armor">🛡️ زره</div>
    <div class="tab" data-tab="skins">👗 اسکین</div>
    <div class="tab" data-tab="powerups">⭐ قدرت</div>
    <div class="tab" data-tab="consumables">💊 مصرفی</div>
  </div>
  <div id="shopItems"></div>
</div>
<button class="close-panel-btn" id="closeShop" style="display:none">بستن 🔙</button>

<div class="panel" id="achScreen">
  <h2>🎖️ دستاوردها</h2>
  <div id="achList"></div>
</div>
<button class="close-panel-btn" id="closeAch" style="display:none">بستن 🔙</button>

<div class="panel" id="scoreScreen">
  <h2>🏆 جدول امتیازات</h2>
  <div class="panel-coins">بهترین امتیاز شما</div>
  <div id="scoreList"></div>
  <div style="text-align:center;margin-top:20px">
    <button class="sec-btn" id="clearScores">🗑️ پاک کردن همه</button>
  </div>
</div>
<button class="close-panel-btn" id="closeScore" style="display:none">بستن 🔙</button>

<div class="fs-screen" id="levelEndScreen" style="display:none">
  <div class="big" id="levelEndEmoji">🎉</div>
  <h1 id="levelEndTitle">آفرین!</h1>
  <div class="stat" id="levelEndMsg"></div>
  <div class="stat">🪙 سکه: <span id="levelEndCoins">0</span></div>
  <div class="stat" id="levelEndTime"></div>
  <div style="margin-top:10px">
    <button id="nextLevelBtn">مرحله بعد ➡️</button>
    <button class="sec-btn" id="shopFromEndBtn">🏪 فروشگاه</button>
  </div>
</div>

<div class="fs-screen" id="startScreen">
  <div class="big" style="font-size:70px;animation:bounce 1.5s infinite alternate">🛢️</div>
  <h1>بی‌بی روغن - نسخه نهایی</h1>
  <p style="color:#ffd700;font-weight:bold">شخصیت خودت رو انتخاب کن:</p>
  <div class="char-select" id="charSelect"></div>
  <button class="start-btn" id="startBtn">شروع ماجراجویی 🚀</button>
</div>

<script>
(function(){
"use strict";

// ============ CANVAS ============
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 200));
resize();

// ============ CHARACTERS ============
const CHARACTERS = [
  { id:"bibi", name:"بی‌بی روغن", emoji:"👵", desc:"متعادل", speed:1.0, damage:1.0, health:1.0 },
  { id:"bibi_super", name:"بی‌بی قهرمان", emoji:"🦸", desc:"قوی ولی کند", speed:0.85, damage:1.3, health:1.2 },
  { id:"bibi_ninja", name:"بی‌بی نینجا", emoji:"🥷", desc:"سریع ولی ضعیف", speed:1.35, damage:0.85, health:0.85 }
];

// ============ ACHIEVEMENTS ============
const ACHIEVEMENTS = [
  { id:"first_kill", name:"اولین کشتار", desc:"اولین دشمن رو روغن‌کاری کن", icon:"🎯", check: s => s.kills >= 1 },
  { id:"killer_10", name:"قاتل ۱۰", desc:"۱۰ دشمن رو نابود کن", icon:"⚔️", check: s => s.kills >= 10 },
  { id:"killer_50", name:"قاتل ۵۰", desc:"۵۰ دشمن رو نابود کن", icon:"💀", check: s => s.kills >= 50 },
  { id:"killer_100", name:"قاتل ۱۰۰", desc:"۱۰۰ دشمن رو نابود کن", icon:"🔪", check: s => s.kills >= 100 },
  { id:"rich", name:"پولدار", desc:"۱۰۰۰ سکه جمع کن", icon:"💰", check: s => s.totalCoins >= 1000 },
  { id:"very_rich", name:"خیلی پولدار", desc:"۵۰۰۰ سکه جمع کن", icon:"💎", check: s => s.totalCoins >= 5000 },
  { id:"level_5", name:"مبتدی", desc:"به مرحله ۵ برس", icon:"🌟", check: s => s.maxLevel >= 5 },
  { id:"level_10", name:"حرفه‌ای", desc:"به مرحله ۱۰ برس", icon:"⭐", check: s => s.maxLevel >= 10 },
  { id:"level_20", name:"قهرمان", desc:"به مرحله ۲۰ برس", icon:"🏅", check: s => s.maxLevel >= 20 },
  { id:"level_30", name:"افسانه‌ای", desc:"به مرحله ۳۰ برس", icon:"👑", check: s => s.maxLevel >= 30 },
  { id:"boss_killer", name:"اژدهاکش", desc:"اژدهای روغن رو شکست بده", icon:"🐉", check: s => s.bossDefeated },
  { id:"combo_20", name:"کمبوکار", desc:"کمبو ۲۰ رو بزن", icon:"🔥", check: s => s.maxCombo >= 20 },
  { id:"all_weapons", name:"جنگ‌افزارفروش", desc:"همه سلاح‌ها رو بخر", icon:"🗡️", check: s => s.ownedWeapons.length >= 10 },
  { id:"all_skins", name:"مدگرا", desc:"همه اسکین‌ها رو بخر", icon:"👗", check: s => s.ownedSkins.length >= 7 },
  { id:"no_damage", name:"بی‌آسیب", desc:"یه مرحله رو بدون آسیب بگذرون", icon:"🛡️", check: s => s.perfectLevel }
];

// ============ SHOP DATA ============

function buildLevel(num){
  const idx = num - 1;
  rooms = LAYOUTS[idx % LAYOUTS.length];
  const walls = [];
  walls.push({ x:0, y:0, w:WORLD.w, h:30 });
  walls.push({ x:0, y:WORLD.h-30, w:WORLD.w, h:30 });
  walls.push({ x:0, y:0, w:30, h:WORLD.h });
  walls.push({ x:WORLD.w-30, y:0, w:30, h:WORLD.h });
  for (let i = 0; i < rooms.length; i++){
    for (let j = i + 1; j < rooms.length; j++){
      const r1 = rooms[i], r2 = rooms[j];
      if (Math.abs(r1.x + r1.w - r2.x) < 5 || Math.abs(r2.x + r2.w - r1.x) < 5){
        const oY1 = Math.max(r1.y, r2.y), oY2 = Math.min(r1.y + r1.h, r2.y + r2.h);
        if (oY2 > oY1 + 100){
          const mid = (oY1 + oY2) / 2, ds = 130;
          const x = r1.x < r2.x ? r1.x + r1.w : r2.x + r2.w;
          walls.push({ x, y:oY1, w:30, h:(mid - ds/2) - oY1 });
          walls.push({ x, y:mid + ds/2, w:30, h:oY2 - (mid + ds/2) });
        }
      }
      if (Math.abs(r1.y + r1.h - r2.y) < 5 || Math.abs(r2.y + r2.h - r1.y) < 5){
        const oX1 = Math.max(r1.x, r2.x), oX2 = Math.min(r1.x + r1.w, r2.x + r2.w);
        if (oX2 > oX1 + 100){
          const mid = (oX1 + oX2) / 2, ds = 130;
          const y = r1.y < r2.y ? r1.y + r1.h : r2.y + r2.h;
          walls.push({ x:oX1, y, w:(mid - ds/2) - oX1, h:30 });
          walls.push({ x:mid + ds/2, y, w:oX2 - (mid + ds/2), h:30 });
        }
      }
    }
  }
  obstacles = walls.concat(FURNITURE);
}

function circleRectCollide(cx, cy, r, rect){
  const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - nx, dy = cy - ny;
  return dx*dx + dy*dy < r*r;
}
function collides(x, y, r){
  for (let i = 0; i < obstacles.length; i++){
    if (circleRectCollide(x, y, r, obstacles[i])) return true;
  }
  return false;
}

const camera = { x: 0, y: 0, shakeX: 0, shakeY: 0 };
function updateCamera(){
  const tx = player.x - W/2, ty = player.y - H/2;
  camera.x += (tx - camera.x) * 0.12;
  camera.y += (ty - camera.y) * 0.12;
  if (camera.x < 0) camera.x = 0;
  if (camera.y < 0) camera.y = 0;
  if (camera.x > WORLD.w - W) camera.x = WORLD.w - W;
  if (camera.y > WORLD.h - H) camera.y = WORLD.h - H;
  if (shakeAmount > 0){
    camera.shakeX = (Math.random() - 0.5) * shakeAmount;
    camera.shakeY = (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.85;
    if (shakeAmount < 0.3) shakeAmount = 0;
  } else { camera.shakeX = 0; camera.shakeY = 0; }
}

let joyActive = false, joyPointerId = null;
let joyOriginX = 0, joyOriginY = 0, joyX = 0, joyY = 0;
const joyRadius = 60;
const joystickEl = document.getElementById("joystick");
const joyKnob = document.getElementById("joyKnob");

// چک کن آیا نقطه روی یه UI element هست
function isOnUI(x, y){
  const elements = document.querySelectorAll(".btn, #menuPanel button, .close-panel-btn, .start-btn, .sec-btn, .fs-screen, .panel");
  for (const el of elements){
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
  }
  return false;
}

// رویدادهای جوی‌استیک روی document
document.addEventListener("pointerdown", e => {
  if (joyPointerId !== null) return;
  // اگه روی UI بود، جوی‌استیک فعال نشه
  if (isOnUI(e.clientX, e.clientY)) return;
  // فقط نیمه چپ صفحه
  if (e.clientX >= W / 2) return;
  
  joyPointerId = e.pointerId;
  joyActive = true;
  joyOriginX = e.clientX;
  joyOriginY = e.clientY;
  joyX = e.clientX;
  joyY = e.clientY;
  
  joystickEl.style.left = (joyOriginX - 60) + "px";
  joystickEl.style.top = (joyOriginY - 60) + "px";
  joystickEl.classList.add("active");
  joyKnob.style.transform = "translate(-50%,-50%)";
  e.preventDefault();
}, { passive: false });

document.addEventListener("pointermove", e => {
  if (e.pointerId !== joyPointerId) return;
  joyX = e.clientX;
  joyY = e.clientY;
  
  const dx = joyX - joyOriginX, dy = joyY - joyOriginY;
  const dist = Math.hypot(dx, dy);
  
  if (dist > joyRadius){
    joyOriginX = joyX - (dx / dist) * joyRadius;
    joyOriginY = joyY - (dy / dist) * joyRadius;
    joystickEl.style.left = (joyOriginX - 60) + "px";
    joystickEl.style.top = (joyOriginY - 60) + "px";
  }
  
  const ndx = joyX - joyOriginX, ndy = joyY - joyOriginY;
  joyKnob.style.transform = `translate(calc(-50% + ${ndx}px), calc(-50% + ${ndy}px))`;
}, { passive: true });

function endPointer(e){
  if (e.pointerId !== joyPointerId) return;
  joyPointerId = null;
  joyActive = false;
  joyKnob.style.transform = "translate(-50%,-50%)";
  joystickEl.classList.remove("active");
}
document.addEventListener("pointerup", endPointer);
document.addEventListener("pointercancel", endPointer);
document.addEventListener("contextmenu", e => e.preventDefault());

function getInputVec(){
  if (joyActive && joyPointerId !== null){
    const dx = joyX - joyOriginX, dy = joyY - joyOriginY;
    const dist = Math.hypot(dx, dy);
    if (dist < 5) return { x:0, y:0 };
    const norm = Math.min(dist, joyRadius) / joyRadius;
    return { x:(dx/dist)*norm, y:(dy/dist)*norm };
  }
  let vx = 0, vy = 0;
  if (keys["w"] || keys["arrowup"]) vy -= 1;
  if (keys["s"] || keys["arrowdown"]) vy += 1;
  if (keys["a"] || keys["arrowleft"]) vx -= 1;
  if (keys["d"] || keys["arrowright"]) vx += 1;
  const m = Math.hypot(vx, vy);
  if (m > 0){ vx /= m; vy /= m; }
  return { x:vx, y:vy };
}

// ============ AUDIO ============
let soundOn = true;
let audioCtx = null;
let musicGain = null;
let musicOsc = null;

function initAudio(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function startMusic(){
  if (!audioCtx || musicOsc) return;
  try {
    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.03;
    musicGain.connect(audioCtx.destination);
    const osc1 = audioCtx.createOscillator();
    osc1.type = "sine"; osc1.frequency.value = 110;
    const osc2 = audioCtx.createOscillator();
    osc2.type = "sine"; osc2.frequency.value = 165;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.3;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 20;
    lfo.connect(lfoGain);
    lfoGain.connect(osc1.frequency);
    osc1.connect(musicGain);
    osc2.connect(musicGain);
    osc1.start(); osc2.start(); lfo.start();
    musicOsc = { osc1, osc2, lfo };
  } catch(e){}
}

function stopMusic(){
  if (musicOsc){
    try { musicOsc.osc1.stop(); musicOsc.osc2.stop(); musicOsc.lfo.stop(); } catch(e){}
    musicOsc = null;
  }
}

function findPersianVoice(){
  if (!("speechSynthesis" in window)) return null;
  const v = speechSynthesis.getVoices();
  return v.find(x => x.lang && x.lang.toLowerCase().startsWith("fa"))
      || v.find(x => x.lang && x.lang.toLowerCase().startsWith("ar"))
      || v[0] || null;
}

function speak(text, pitch, rate){
  if (!soundOn || !("speechSynthesis" in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voice = findPersianVoice();
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : "fa-IR";
    u.pitch = pitch || 1.3;
    u.rate = rate || 0.9;
    speechSynthesis.speak(u);
  } catch(e){}
}

function showDialog(text, duration, pitch, rate){
  const d = document.getElementById("dialog");
  d.textContent = text;
  d.classList.add("show");
  clearTimeout(d._timeout);
  d._timeout = setTimeout(() => d.classList.remove("show"), duration || 3000);
  speak(text, pitch, rate);
}

    hurt:   { type:"sawtooth", freq:200, endFreq:80, dur:0.25, vol:0.2 },
    bullet: { type:"square", freq:800, endFreq:300, dur:0.1, vol:0.08 },
    coin:   { type:"sine", freq:1200, endFreq:1600, dur:0.2, vol:0.1 },
    boss:   { type:"sawtooth", freq:100, endFreq:50, dur:0.5, vol:0.3 }
  };
  if (sounds[type]){
    const s = sounds[type];
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = s.type;
    o.frequency.setValueAtTime(s.freq, now);
    o.frequency.exponentialRampToValueAtTime(s.endFreq, now + s.dur);
    g.gain.setValueAtTime(s.vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + s.dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + s.dur);
  } else if (type === "win"){
    [500, 700, 900, 1200].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = now + i * 0.1;
      o.type = "sine";
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.2);
    });
  }
}

// ============ SPEECH RECOGNITION ============
let isListening = false, recognition = null;

function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const rec = new SR();
  rec.lang = "fa-IR"; rec.continuous = true; rec.interimResults = false;
  rec.onresult = (e) => {
    const last = e.results[e.results.length - 1];
    if (last.isFinal) handleVoiceCommand(last[0].transcript.trim());
  };
  rec.onerror = (e) => { if (e.error === "not-allowed") stopListening(); };
  rec.onend = () => { if (isListening) try { rec.start(); } catch(e){} };
  return rec;
}

function startListening(){
  if (!recognition) recognition = initRecognition();
  if (!recognition){
    showDialog("مرورگر پشتیبانی نمی‌کنه! از Chrome استفاده کن!", 3500, 1.4, 0.95);
    return;
  }
  try {
    recognition.start();
    isListening = true;
    document.getElementById("voiceBtn").classList.add("listening");
  } catch(e){}
}
function stopListening(){
  if (recognition && isListening){
    isListening = false;
    try { recognition.stop(); } catch(e){}
    document.getElementById("voiceBtn").classList.remove("listening");
  }
}

// ============ PARSER ============
function parsePersianCommand(text){
  const t = text.replace(/[،.,؟!?؛;:]/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
  const parsed = {
    verbs:[], directions:[], targets:[], counts:null,
    isQuestion:/[؟?]/.test(text) || /چیه|کیه|کجاست|چند|چطور|چرا|آیا|کدوم/.test(t),
    isGreeting:/سلام|درود|صبح بخیر|شب بخیر|خوبی|چطوری|چه خبر/.test(t),
    isThanks:/ممنون|مرسی|سپاس|دستت درد نکنه|لطف/.test(t),
    raw:t
  };
  const verbPatterns = [
    { verb:"attackAll", re:/همه.*(دشمن|دشمنان|اهالی|نفرات|مردم).*(نابود|بکش|نابود کن|بزن)|نابود کن همه|همه رو نابود کن|همه رو بکش|همه دشمنان|همه دشمنارو|تمام دشمنان|تموم دشمنان/ },
    { verb:"usePotion", re:/معجون|شفا|بخور|درمان|سپر بگیر|سرعت بگیر/ },
    { verb:"attack", re:/حمله|بزن|بزنی|شلیک|روغن بزن|روغن بده|بکش|نابود|منهدم|له کن/ },
    { verb:"seek", re:/بگرد|پیدا کن|پیداش کن|جستجو|دنبال|تعقیب|شکار|گرفتن|بیارش/ },
    { verb:"stop", re:/بایست|وایسا|توقف|بسه|بس کن|هیس|صبر|منتظر/ },
    { verb:"move", re:/برو|راه بیفت|راه بیا|حرکت کن|بیا|جلو برو|عقب برو|بدو/ },
    { verb:"dance", re:/برقص|بشکن|اهتزاز|رقص/ },
    { verb:"hide", re:/قایم|پنهان|مخفی/ },
    { verb:"jump", re:/بپر|جهش|پرش/ },
    { verb:"turn", re:/بچرخ|دور بزن|دور خودت/ },
    { verb:"heal", re:/درمان|خودتو درمان|سلامتی بده|شفا/ }
  ];
  verbPatterns.forEach(p => { if (p.re.test(t)) parsed.verbs.push(p.verb); });
  if (/بالا|شمال|جلو/.test(t)) parsed.directions.push("up");
  if (/پایین|جنوب|عقب/.test(t)) parsed.directions.push("down");
  if (/چپ|غرب/.test(t)) parsed.directions.push("left");
  if (/راست|شرق/.test(t)) parsed.directions.push("right");
  if (/مریم|گلی/.test(t)) parsed.targets.push("مریم");
  if (/زهرا|کماندو/.test(t)) parsed.targets.push("زهرا");
  if (/اسماع|روغن خور/.test(t)) parsed.targets.push("اسماع");
  if (/حنانه|بدترکیب/.test(t)) parsed.targets.push("حنانه");
  if (/بچه|کوچیک/.test(t)) parsed.targets.push("بچه");
  if (/مگس/.test(t)) parsed.targets.push("مگس");
  if (/همه|تمام|همگی|اهالی/.test(t)) parsed.targets.push("all");
  if (/نزدیک/.test(t)) parsed.targets.push("nearest");
  if (/دورترین|دور/.test(t)) parsed.targets.push("farthest");
  const counts = {"یک":1,"یه":1,"دو":2,"سه":3,"چهار":4,"پنج":5,"شش":6,"هفت":7,"هشت":8,"نه":9,"ده":10};
  for (const [w, n] of Object.entries(counts)){
    if (new RegExp("\\b" + w + "\\b").test(t)){ parsed.counts = n; break; }
  }
  return parsed;
}

// ============ MOVEMENT ============
let autoMoveTarget = null, autoMoveTimer = 0;
let voiceMoveVec = { x:0, y:0 }, voiceMoveTimer = 0;
let autoHuntMode = false, autoHuntTimer = 0, autoHuntAttackTimer = 0;
let combo = 0, comboTimer = 0;

function moveTowards(nx, ny){ autoMoveTarget = { x:nx, y:ny }; autoMoveTimer = 300; }
function getAliveNPCs(){ return npcs.filter(n => n.state !== "defeated"); }
function findNearestNPC(){
  const a = getAliveNPCs();
  if (!a.length) return null;
  let best = a[0], bd = Infinity;
  a.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < bd){ bd = d; best = n; } });
  return best;
}
function findFarthestNPC(){
  const a = getAliveNPCs();
  if (!a.length) return null;
  let best = a[0], bd = 0;
  a.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d > bd){ bd = d; best = n; } });
  return best;
}

function startAutoHunt(){
  if (autoHuntMode) return;
  const alive = getAliveNPCs();
  if (alive.length === 0 && !boss){ showDialog("همه نابود شدن! 🎉", 2500, 1.55, 0.9); return; }
  autoHuntMode = true; autoHuntTimer = 0; autoHuntAttackTimer = 0;
  document.getElementById("autoHuntIndicator").classList.add("show");
  showDialog("باشه! همه‌شون رو نابود می‌کنم! 🔥", 2500, 1.6, 1);
}
function stopAutoHunt(){
  autoHuntMode = false;
  document.getElementById("autoHuntIndicator").classList.remove("show");
}
function updateAutoHunt(){
  if (!autoHuntMode) return;
  autoHuntTimer++;
  if (autoHuntTimer > 3600){ stopAutoHunt(); return; }
  let target = findNearestNPC();
  if (!target && boss && boss.state !== "defeated") target = boss;
  if (!target){ stopAutoHunt(); return; }
  const dx = target.x - player.x, dy = target.y - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 55){
    voiceMoveVec = { x: dx/dist, y: dy/dist };
    voiceMoveTimer = 5;
  } else {
    const ang = Math.atan2(dy, dx);
    if (Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang))) player.dir = Math.cos(ang) > 0 ? 3 : 1;
    else player.dir = Math.sin(ang) > 0 ? 0 : 2;
    voiceMoveTimer = 0;
    if (autoHuntAttackTimer <= 0){ attack(); autoHuntAttackTimer = 8; }
  }
  if (autoHuntAttackTimer > 0) autoHuntAttackTimer--;
}

// ============ CONSUMABLES ============
function usePotion(){
  const c = gameState.consumables;
  if (c.potion_health > 0 && player.health < player.maxHealth){
    c.potion_health--;
    player.health = Math.min(player.maxHealth, player.health + 50);
    spawnParticles(player.x, player.y, "#ff3030", 20);
    showDialog("❤️ +50 جون!", 1500, 1.5, 1);
    updateItemBtn(); updateHUD(); saveGame();
    return;
  }
  if (c.potion_speed > 0){
    c.potion_speed--;
    player.speedBoostTimer = 900;
    spawnParticles(player.x, player.y, "#7fe3ff", 20);
    showDialog("⚡ سرعت بیشتر!", 1500, 1.5, 1);
    updateItemBtn(); saveGame();
    return;
  }
  if (c.potion_shield > 0){
    c.potion_shield--;
    player.shieldTimer = 600;
    spawnParticles(player.x, player.y, "#4ade80", 20);
    showDialog("🛡️ سپر فعال!", 1500, 1.5, 1);
    updateItemBtn(); saveGame();
    return;
  }
  if (c.bomb > 0){
    c.bomb--;
    let killed = 0;
    npcs.forEach(n => {
      if (n.state === "defeated") return;
      const d = Math.hypot(n.x - player.x, n.y - player.y);
      if (d < 300){
        n.health = 0; n.state = "defeated"; n.defeatedTimer = 90;
        gameState.kills++; killed++;
        spawnParticles(n.x, n.y, "#ff6b00", 20);
        gameState.coins += 10;
      }
    });
    shakeScreen(30);
    showDialog("💣 بمب! " + killed + " دشمن نابود شد!", 2000, 1.5, 1);
    updateItemBtn(); updateHUD(); saveGame();
    return;
  }
  showDialog("هیچ آیتمی نداری! از فروشگاه بخر 💊", 2500, 1.5, 0.9);
}

function updateItemBtn(){
  const c = gameState.consumables;
  const total = c.potion_health + c.potion_speed + c.potion_shield + c.bomb;
  document.getElementById("itemCount").textContent = total;
  document.getElementById("itemBtn").classList.toggle("show", total > 0);
}

// ============ VOICE COMMAND ============
function handleVoiceCommand(text){
  const cmd = parsePersianCommand(text);
  if (cmd.verbs.includes("attackAll")){ startAutoHunt(); return; }
  if (cmd.verbs.includes("usePotion")){ usePotion(); return; }
  if (cmd.isGreeting){ showDialog("سلام عزیزم! روغن می‌خوای؟ 🛢️", 2500, 1.55, 0.85); return; }
  if (cmd.isThanks){ showDialog("خواهش می‌کنم عزیزم! 🌹", 2200, 1.55, 0.9); return; }
  if (cmd.isQuestion && cmd.verbs.length === 0){
    if (/چند/.test(cmd.raw)){
      const a = getAliveNPCs().length;
      showDialog(`${a} نفر موندن! 💪`, 3000, 1.5, 0.9);
      return;
    }
    if (/کجا|کدوم/.test(cmd.raw)){
      const n = findNearestNPC();
      if (n){ const d = Math.round(Math.hypot(n.x-player.x, n.y-player.y)); showDialog(`${n.name} نزدیک‌ترینه! ${d} قدم! 🎯`, 3500, 1.5, 0.9); }
      else showDialog("کسی نمونده! 🎉", 2000, 1.5, 0.9);
      return;
    }
    showDialog("نفهمیدم! واضح‌تر بپرس! 🤔", 2500, 1.5, 0.9);
    return;
  }
  if (cmd.verbs.length === 0 && cmd.targets.length === 0){
    showDialog("نفهمیدم! بگو: همه دشمنان رو نابود کن!", 3000, 1.5, 0.9);
    return;
  }
  const hasSeek = cmd.verbs.includes("seek");
  const hasAttack = cmd.verbs.includes("attack");
  const hasMove = cmd.verbs.includes("move");
  const hasStop = cmd.verbs.includes("stop");
  const hasDance = cmd.verbs.includes("dance");
  const hasHide = cmd.verbs.includes("hide");
  const hasJump = cmd.verbs.includes("jump");
  const hasTurn = cmd.verbs.includes("turn");
  const hasHeal = cmd.verbs.includes("heal");
  if (hasStop){
    stopAutoHunt();
    autoMoveTimer = 0; autoMoveTarget = null; voiceMoveTimer = 0;
    npcs.forEach(n => { n.state = "wander"; });
    showDialog("باشه، وایسادم! 🛑", 1500, 1.5, 0.9);
    return;
  }
  if (hasDance){
    showDialog("واو! بزن بریم! 💃🕺", 2500, 1.6, 1);
    for (let i = 0; i < 15; i++) setTimeout(() => spawnParticles(player.x + (Math.random()-0.5)*80, player.y + (Math.random()-0.5)*80, "#ff6b9d", 3), i*100);
    return;
  }
  if (hasHide){ showDialog("قایم شدم! 🤫", 2500, 1.4, 0.85); player.hideTimer = 180; return; }
  if (hasJump){
    showDialog("هووووپ! 🦘", 1500, 1.7, 1.2);
    for (let i = 0; i < 8; i++) spawnParticles(player.x, player.y, "#7fd4f0", 2);
    return;
  }
  if (hasTurn){ player.dir = (player.dir + 1) % 4; showDialog("چرخیدم! 🔄", 1500, 1.5, 1); return; }
  if (hasHeal){
    player.health = player.maxHealth; updateHUD();
    spawnParticles(player.x, player.y, "#7ed6a0", 20);
    showDialog("درمان کردم! 💚", 2500, 1.5, 0.9);
    return;
  }
  if (hasMove && cmd.directions.length > 0){
    const dir = cmd.directions[0];
    const dirVecs = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    if (dirVecs[dir]){
      voiceMoveVec = dirVecs[dir]; voiceMoveTimer = 120;
      showDialog("دارم می‌رم!", 1800, 1.5, 0.9);
      return;
    }
  }
  if (hasSeek || (hasMove && cmd.targets.length > 0)){
    let target = null;
    if (cmd.targets.includes("all")){ target = findNearestNPC(); }
    else if (cmd.targets.includes("nearest")) target = findNearestNPC();
    else if (cmd.targets.includes("farthest")) target = findFarthestNPC();
    else {
      for (const tid of cmd.targets){
        if (["nearest","farthest","all"].includes(tid)) continue;
        target = npcs.find(n => n.name.includes(tid) && n.state !== "defeated");
        if (target) break;
      }
    }
    if (!target) target = findNearestNPC();
    if (!target){ showDialog("کسی نمونده! 🎉", 2500, 1.5, 0.9); return; }
    moveTowards(target.x, target.y);
    target.state = "flee"; target.stateTimer = 240;
    showDialog("دارم میام دنبال " + target.name + "! 🏃", 2200, 1.55, 0.9);
    return;
  }
  if (hasAttack){
    const nearest = findNearestNPC();
    if (nearest && Math.hypot(nearest.x-player.x, nearest.y-player.y) < 200){
      const ang = Math.atan2(nearest.y-player.y, nearest.x-player.x);
      if (Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang))) player.dir = Math.cos(ang) > 0 ? 3 : 1;
      else player.dir = Math.sin(ang) > 0 ? 0 : 2;
    }
    for (let i = 0; i < 3; i++) setTimeout(() => attack(), i * 250);
    showDialog("روغن بخور! 🛢️", 2000, 1.6, 1);
    return;
  }
  if (hasMove){ voiceMoveVec = { x:0, y:-1 }; voiceMoveTimer = 60; showDialog("دارم می‌رم! 🚶", 1500, 1.5, 0.9); return; }
  showDialog("نفهمیدم! مثلاً بگو: همه دشمنان رو نابود کن!", 3500, 1.4, 0.9);
}

// ============ ATTACK ============
function attack(){
  if (player.attackCooldown > 0) return;
  if (player.mana < 5) return;
  player.attackCooldown = 18;
  player.mana = Math.max(0, player.mana - 5);
  const weapon = getWeapon();
  const ch = getCharacter();
  playBeep("attack");
  const dirAngles = [Math.PI/2, Math.PI, -Math.PI/2, 0];
  const baseAngle = dirAngles[player.dir];
  const range = weapon.range;
  const angleSpread = Math.PI / 3;
  const targets = npcs.concat(boss && boss.state !== "defeated" ? [boss] : []);
  targets.forEach(n => {
    if (n.state === "defeated") return;
    const dx = n.x - player.x, dy = n.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > range) return;
    const ang = Math.atan2(dy, dx);
    let diff = Math.abs(ang - baseAngle);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff < angleSpread/2 || dist < 40){
      let dmg = Math.round((weapon.damage + Math.floor(Math.random() * 10)) * ch.damage);
      if (gameState.ownedPowerups.includes("crit") && Math.random() < 0.2) dmg *= 2;
      n.health -= dmg;
      n.hitFlash = 12;
      if (!n.isBoss) n.oilLevel = Math.min(100, (1 - n.health/n.maxHealth) * 100);
      spawnParticles(n.x, n.y, "#ffb700", 10);
      damageNumbers.push({ x:n.x, y:n.y-20, value:dmg, life:60 });
      playBeep("hit");
      shakeScreen(5);
      if (n.health <= 0){
        n.state = "defeated";
        n.defeatedTimer = 90;
        let pts = n.isBoss ? 500 : 10;
        if (gameState.ownedPowerups.includes("double")) pts *= 2;
        gameState.coins += pts;
        gameState.totalCoins += pts;
        gameState.kills++;
        combo++;
        comboTimer = 90;
        if (combo > gameState.maxCombo) gameState.maxCombo = combo;
        spawnParticles(n.x, n.y, "#7ed6a0", 25);
        if (!n.isBoss && Math.random() < 0.4) spawnPrizeBox(n.x, n.y);
        if (n.isBoss){
          gameState.bossDefeated = true;
          showBossDefeated();
        }
        updateHUD(); checkLevelComplete();
      }
    }
  });
  const px = player.x + Math.cos(baseAngle) * 40;
  const py = player.y + Math.sin(baseAngle) * 40;
  for (let i = 0; i < 12; i++){
    const a = baseAngle + (Math.random()-0.5) * angleSpread;
    particles.push({
      x: px, y: py,
      vx: Math.cos(a) * (3 + Math.random()*3),
      vy: Math.sin(a) * (3 + Math.random()*3),
      life: 1, color:"#ffd700", size:4 + Math.random()*4
    });
  }
}

function spawnPrizeBox(x, y){
  const types = ["health", "speed", "shield", "coin"];
  prizeBoxes.push({
    x, y, type: types[Math.floor(Math.random() * types.length)],
    life: 600, anim: 0
  });
}

function collectPrizeBox(box){
  playBeep("coin");
  spawnParticles(box.x, box.y, "#ffd700", 20);
  if (box.type === "coin"){
    gameState.coins += 25; gameState.totalCoins += 25;
    showDialog("💰 +25 سکه!", 1500, 1.5, 1);
  } else if (box.type === "health"){
    player.health = Math.min(player.maxHealth, player.health + 30);
    showDialog("❤️ +30 جون!", 1500, 1.5, 1);
  } else if (box.type === "speed"){
    player.speedBoostTimer = 600;
    showDialog("⚡ سرعت بیشتر!", 1500, 1.5, 1);
  } else if (box.type === "shield"){
    player.shieldTimer = 400;
    showDialog("🛡️ سپر!", 1500, 1.5, 1);
  }
  updateHUD();
}

  };

function showBossDefeated(){
  document.getElementById("bossBar").classList.remove("show");
  playBeep("win");
  shakeScreen(40);
  showDialog("🎉 اژدها شکست خورد! تو قهرمان شدی! 🏆", 5000, 1.6, 1);
}

function updateBoss(){
  if (!boss || boss.state === "defeated") return;
  if (boss.hitFlash > 0) boss.hitFlash--;
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 100){
    const ang = Math.atan2(dy, dx);
    const speed = 1.2;
    let nx = boss.x + Math.cos(ang) * speed;
    let ny = boss.y + Math.sin(ang) * speed;
    if (!collides(nx, boss.y, boss.r)) boss.x = nx;
    if (!collides(boss.x, ny, boss.r)) boss.y = ny;
    boss.dir = Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang))
      ? (Math.cos(ang) > 0 ? 3 : 1) : (Math.sin(ang) > 0 ? 0 : 2);
    boss.walkFrame += 0.4;
  }
  if (boss.bulletCooldown <= 0 && dist < 500){
    const baseAng = Math.atan2(dy, dx);
    for (let i = -1; i <= 1; i++){
      const a = baseAng + i * 0.3;
      spawnBullet(boss.x, boss.y, Math.cos(a), Math.sin(a), "enemy", 4);
    }
    boss.bulletCooldown = 60;
    playBeep("boss");
  }
  if (boss.bulletCooldown > 0) boss.bulletCooldown--;
  if (boss.slamCooldown <= 0 && dist < 100){
    shakeScreen(30);
    player.health -= 15;
    player.hitFlash = 20;
    playBeep("hurt");
    boss.slamCooldown = 120;
    updateHUD();
    if (player.health <= 0){ gameStarted = false; showLevelEnd(false); return; }
  }
  if (boss.slamCooldown > 0) boss.slamCooldown--;
  boss.dialogueTimer--;
  if (boss.dialogueTimer <= 0){
    const dialogues = ["منو نمی‌تونی بزنی! 🐉", "غررر! 🔥", "مرگ توئه! 💀", "من ابدی‌ام! 👑"];
    speak(dialogues[boss.dialogueIndex], 0.6, 0.8);
    boss.dialogueIndex = (boss.dialogueIndex + 1) % dialogues.length;
    boss.dialogueTimer = 300;
  }
  document.getElementById("bossFill").style.width = (boss.health / boss.maxHealth * 100) + "%";
}

// ============ LEVEL ============
let gameStarted = false, levelComplete = false, levelStartTime = 0, levelTookDamage = false;
const ENEMY_NAMES = ["مریم گلی","زهرا کماندو","اسماع روغن‌خور","حنانه بدترکیب","بچه‌خور","مگس","دایی جواد","خاله سوسن","عمو رحیم","ننه صغری","پسر عمو","دختر خاله"];
const ENEMY_COLORS = ["#ff8ac4","#3a8ac8","#68c890","#ffb700","#8a6ac8","#4a4a4a","#e74c3c","#9b59b6","#f39c12","#16a085","#c0392b","#8e44ad"];
const ENEMY_DIALOGUES = ["بیا بگیرم! 🏃","تو نمی‌تونی منو بزنی! 😎","روغن نده به من! 😱","کمک! بی‌بی دیوونه شده! 😂","آخه چرا من؟ 🥺","برو خونت رو بچسب! 😤","داره تعقیبم می‌کنه! 😭","اِ اِ اِ... 🥶","نکن! من خوشم نمیاد! 🤢","بگیر منو خودت می‌سوزی! 🔥"];

let npcs = [];
let currentLevel = 1;
let levelConfig = null;

function getLevelConfig(num){
  const idx = num - 1;
  return {
    level: num,
    enemyCount: Math.min(3 + Math.floor(idx * 0.5), 15),
    enemyHealth: 50 + idx * 18,
    enemySpeed: 0.55 + idx * 0.045,
    enemyDamage: 1 + Math.floor(idx / 3),
    enemyHasWeapon: idx >= 4,
    hasBoss: num === 30
  };
}

function spawnNPCsForLevel(){
  npcs = [];
  const count = levelConfig.enemyCount;
  for (let i = 0; i < count; i++){
    let placed = false, tries = 0, nx, ny;
    while (!placed && tries < 50){
      const room = rooms[Math.floor(Math.random() * rooms.length)];
      nx = room.x + 80 + Math.random() * (room.w - 160);
      ny = room.y + 80 + Math.random() * (room.h - 160);
      if (!collides(nx, ny, 22)) placed = true;
      tries++;
    }
    if (!placed){ nx = 300 + i * 100; ny = 300; }
    const typeIdx = i % ENEMY_NAMES.length;
    npcs.push({
      id: "npc_" + i + "_" + Math.random().toString(36).substr(2,5),
      name: ENEMY_NAMES[typeIdx],
      color: ENEMY_COLORS[typeIdx], hair: "#3a1a0a",
      x: nx, y: ny, r: 20, vx: 0, vy: 0,
      dir: 0, walkFrame: 0,
      health: levelConfig.enemyHealth, maxHealth: levelConfig.enemyHealth,
      state: "wander", stateTimer: 60 + Math.random() * 100,
      targetX: nx, targetY: ny,
      defeatedTimer: 0, oilLevel: 0, hitFlash: 0,
      hasWeapon: levelConfig.enemyHasWeapon && Math.random() < 0.7,
      weaponCooldown: 0,
      dialogueTimer: 100 + Math.random() * 200,
      dialogueIndex: Math.floor(Math.random() * ENEMY_DIALOGUES.length)
    });
  }
  const room = rooms[Math.floor(Math.random() * rooms.length)];
  items.push({
    x: room.x + 100 + Math.random() * (room.w - 200),
    y: room.y + 100 + Math.random() * (room.h - 200),
    type: "hidden", life: 99999
  });
  if (levelConfig.hasBoss) spawnBoss();
  else { boss = null; document.getElementById("bossBar").classList.remove("show"); }
}

function checkLevelComplete(){
  const alive = getAliveNPCs().length;
  document.getElementById("levelGoal").textContent = (npcs.length - alive) + "/" + npcs.length;
  if (alive === 0 && (!boss || boss.state === "defeated") && !levelComplete){
    levelComplete = true;
    stopAutoHunt();
    setTimeout(() => showLevelEnd(true), 1200);
  }
}

function showLevelEnd(victory){
  const screen = document.getElementById("levelEndScreen");
  const elapsed = Math.round((Date.now() - levelStartTime) / 1000);
  document.getElementById("levelEndEmoji").textContent = victory ? "🎉" : "😵";
  document.getElementById("levelEndTitle").textContent = victory ? "مرحله " + currentLevel + " تموم شد!" : "بی‌بی خسته شد!";
  document.getElementById("levelEndMsg").textContent = victory ? "همه روغن‌کاری شدن!" : "دوباره امتحان کن!";
  document.getElementById("levelEndCoins").textContent = gameState.coins;
  document.getElementById("levelEndTime").textContent = "⏱️ زمان: " + elapsed + " ثانیه";
  if (victory && !levelTookDamage){
    gameState.perfectLevel = true;
    checkAchievements();
  }
  const nextBtn = document.getElementById("nextLevelBtn");
  if (currentLevel >= 30){ nextBtn.textContent = "🎊 بازیت تموم شد!"; nextBtn.disabled = true; }
  else { nextBtn.textContent = "مرحله بعد ➡️"; nextBtn.disabled = false; }
  screen.style.display = "flex";
  saveGame();
  checkAchievements();
}

function nextLevel(){
  document.getElementById("levelEndScreen").style.display = "none";
  currentLevel++;
  gameState.currentLevel = currentLevel;
  if (currentLevel > gameState.maxLevel) gameState.maxLevel = currentLevel;
  saveGame();
  checkAchievements();
  startLevel(currentLevel);
}

function startLevel(num){
  currentLevel = num;
  buildLevel(num);
  levelConfig = getLevelConfig(num);
  spawnNPCsForLevel();
  const startRoom = rooms[0];
  player.x = startRoom.x + 120; player.y = startRoom.y + 120;
  player.health = player.maxHealth;
  player.mana = player.maxMana;
  player.attackCooldown = 0;
  player.speedBoostTimer = 0;
  player.shieldTimer = 0;
  levelComplete = false;
  levelTookDamage = false;
  autoMoveTarget = null; autoMoveTimer = 0; voiceMoveTimer = 0;
  combo = 0; comboTimer = 0;
  stopAutoHunt();
  document.getElementById("levelNum").textContent = num;
  document.getElementById("levelGoal").textContent = "0/" + npcs.length;
  document.getElementById("levelInfo").classList.add("show");
  levelStartTime = Date.now();
  updateHUD();
  updateCamera();
  camera.x = player.x - W/2; camera.y = player.y - H/2;
  showDialog("مرحله " + num + " شروع شد! ⚔️", 2500, 1.5, 0.9);
}

// ============ NPC ============
function updateNPC(n){
  if (n.state === "defeated"){
    if (n.defeatedTimer > 0){ n.defeatedTimer--; n.y += 1; }
    return;
  }
  if (n.hitFlash > 0) n.hitFlash--;
  n.dialogueTimer--;
  if (n.dialogueTimer <= 0){
    if (Math.hypot(n.x - player.x, n.y - player.y) < 300)
      speak(ENEMY_DIALOGUES[n.dialogueIndex], 1.4, 0.95);
    n.dialogueTimer = 200 + Math.random()*200;
    n.dialogueIndex = (n.dialogueIndex + 1) % ENEMY_DIALOGUES.length;
  }
  const dx = player.x - n.x, dy = player.y - n.y;
  const distToPlayer = Math.hypot(dx, dy);
  if (distToPlayer < 220 && n.state !== "chase"){ n.state = "flee"; n.stateTimer = 60; }
  if (n.hasWeapon && n.weaponCooldown <= 0 && distToPlayer < 350 && distToPlayer > 60){
    const angle = Math.atan2(dy, dx);
    spawnBullet(n.x, n.y, Math.cos(angle), Math.sin(angle), "enemy", levelConfig.enemyDamage);
    n.weaponCooldown = 120 - Math.min(60, currentLevel*3);
    playBeep("bullet");
    n.state = "wander";
  }
  if (n.weaponCooldown > 0) n.weaponCooldown--;
  if (n.state === "flee"){
    n.stateTimer--;
    if (n.stateTimer <= 0) n.state = "wander";
    const ang = Math.atan2(-dy, -dx);
    const speed = levelConfig.enemySpeed + 1.2;
    let nx = n.x + Math.cos(ang)*speed, ny = n.y + Math.sin(ang)*speed;
    if (!collides(nx, n.y, n.r)) n.x = nx;
    if (!collides(n.x, ny, n.r)) n.y = ny;
    n.dir = Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang)) ? (Math.cos(ang) > 0 ? 3 : 1) : (Math.sin(ang) > 0 ? 0 : 2);
    n.walkFrame += 0.4;
    n.x = Math.max(40, Math.min(WORLD.w-40, n.x));
    n.y = Math.max(40, Math.min(WORLD.h-40, n.y));
    return;
  }
  n.stateTimer--;
  if (n.stateTimer <= 0){
    const room = rooms[Math.floor(Math.random()*rooms.length)];
    n.targetX = room.x + 80 + Math.random()*(room.w-160);
    n.targetY = room.y + 80 + Math.random()*(room.h-160);
    n.stateTimer = 120 + Math.random()*120;
  }
  const tdx = n.targetX - n.x, tdy = n.targetY - n.y;
  const tdist = Math.hypot(tdx, tdy);
  if (tdist > 10){
    const ang = Math.atan2(tdy, tdx);
    const speed = levelConfig.enemySpeed;
    let nx = n.x + Math.cos(ang)*speed, ny = n.y + Math.sin(ang)*speed;
    if (!collides(nx, n.y, n.r)) n.x = nx; else n.targetX = n.x + (Math.random()-0.5)*200;
    if (!collides(n.x, ny, n.r)) n.y = ny; else n.targetY = n.y + (Math.random()-0.5)*200;
    n.dir = Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang)) ? (Math.cos(ang) > 0 ? 3 : 1) : (Math.sin(ang) > 0 ? 0 : 2);
    n.walkFrame += 0.25;
  }
}

// ============ UPDATE ============
function update(){
  if (!gameStarted) return;
  const input = getInputVec();
  if (voiceMoveTimer > 0){ voiceMoveTimer--; input.x = voiceMoveVec.x; input.y = voiceMoveVec.y; }
  if (autoMoveTimer > 0 && autoMoveTarget){
    autoMoveTimer--;
    const dx = autoMoveTarget.x - player.x, dy = autoMoveTarget.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 30){ input.x = dx/dist; input.y = dy/dist; }
    else { autoMoveTimer = 0; autoMoveTarget = null; }
  }
  const ch = getCharacter();
  let speed = 3.5 * ch.speed;
  if (gameState.ownedPowerups.includes("speed")) speed *= 1.3;
  if (getSkin().id === "ninja") speed *= 1.2;
  if (player.speedBoostTimer > 0){ speed *= 1.5; player.speedBoostTimer--; }
  let vx = input.x * speed, vy = input.y * speed;
  if (Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1){
    if (Math.abs(input.x) > Math.abs(input.y)) player.dir = input.x > 0 ? 3 : 1;
    else player.dir = input.y > 0 ? 0 : 2;
    player.walkFrame += 0.5;
  }
  let nx = player.x + vx, ny = player.y + vy;
  if (!collides(nx, player.y, player.r)) player.x = nx;
  if (!collides(player.x, ny, player.r)) player.y = ny;
  player.x = Math.max(40, Math.min(WORLD.w-40, player.x));
  player.y = Math.max(40, Math.min(WORLD.h-40, player.y));
  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.hitFlash > 0) player.hitFlash--;
  if (player.hideTimer > 0) player.hideTimer--;
  if (player.shieldTimer > 0) player.shieldTimer--;
  if (player.mana < player.maxMana) player.mana = Math.min(player.maxMana, player.mana + 0.2);
  if (gameState.ownedPowerups.includes("regen") && player.health < player.maxHealth)
    player.health = Math.min(player.maxHealth, player.health + 0.03);
  npcs.forEach(updateNPC);
  updateBoss();
  updateAutoHunt();
  if (comboTimer > 0){ comboTimer--; if (comboTimer <= 0) combo = 0; }
  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0){ bullets.splice(i, 1); continue; }
    if (b.owner === "enemy"){
      if (Math.hypot(b.x - player.x, b.y - player.y) < player.r + 6){
        let dmg = b.damage;
        if (gameState.ownedPowerups.includes("shield")) dmg *= 0.5;
        if (player.shieldTimer > 0) dmg = 0;
        if (dmg > 0){
          player.health -= dmg;
          player.hitFlash = 8;
          playBeep("hurt");
          spawnParticles(player.x, player.y, "#ff6b6b", 8);
          shakeScreen(15);
          levelTookDamage = true;
        }
        updateHUD();
        bullets.splice(i, 1);
        if (player.health <= 0){ gameStarted = false; showLevelEnd(false); return; }
      }
    }
    if (collides(b.x, b.y, 4)) bullets.splice(i, 1);
  }
  for (let i = prizeBoxes.length - 1; i >= 0; i--){
    const b = prizeBoxes[i];
    b.life--; b.anim += 0.1;
    if (b.life <= 0){ prizeBoxes.splice(i, 1); continue; }
    if (Math.hypot(b.x - player.x, b.y - player.y) < player.r + 25){
      collectPrizeBox(b);
      prizeBoxes.splice(i, 1);
    }
  }
  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (Math.hypot(it.x - player.x, it.y - player.y) < player.r + 20){
      gameState.coins += 100;
      gameState.totalCoins += 100;
      playBeep("coin");
      spawnParticles(it.x, it.y, "#ffd700", 30);
      showDialog("💎 آیتم مخفی! +100 سکه!", 2500, 1.6, 1);
      items.splice(i, 1);
      updateHUD();
      break;
    }
  }
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = damageNumbers.length - 1; i >= 0; i--){
    damageNumbers[i].y -= 0.8; damageNumbers[i].life--;
    if (damageNumbers[i].life <= 0) damageNumbers.splice(i, 1);
  }
  updateCamera();
  updateHUD();
}

// ============ RENDER ============
function drawCharacter(x, y, r, npc, dir, walkFrame, hitFlash, isPlayer){
  const cx = x - camera.x + camera.shakeX, cy = y - camera.y + camera.shakeY;
  if (cx < -100 || cx > W+100 || cy < -100 || cy > H+100) return;
  const bob = Math.sin(walkFrame) * 3;
  const py = cy + bob;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath(); ctx.ellipse(cx, cy + r*0.9, r*0.9, r*0.4, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  let bodyColor, hairColor, skinColor = "#ffd8b0";
  if (isPlayer){
    const skin = getSkin();
    bodyColor = skin.id === "superhero" ? "#e74c3c" : skin.id === "ninja" ? "#1a1a2a" : skin.id === "pirate" ? "#2c3e50" : "#8a4858";
    hairColor = skin.id === "superhero" ? "#2c3e50" : "#5a3a5a";
    skinColor = "#e8b088";
  } else {
    bodyColor = npc ? npc.color : "#8a4858";
    hairColor = npc ? npc.hair : "#3a1a0a";
  }
  if (hitFlash > 0){ bodyColor = "#fff"; hairColor = "#ff6666"; }
  ctx.save();
  ctx.translate(cx, py);
  const legOff = Math.sin(walkFrame) * 5;
  ctx.fillStyle = "#5a3a1a";
  ctx.beginPath(); ctx.ellipse(-r*0.35, r*0.6 + legOff*0.2, r*0.2, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.35, r*0.6 - legOff*0.2, r*0.2, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.ellipse(0, r*0.15, r*0.65, r*0.75, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 2; ctx.stroke();
  if (isPlayer){
    const armor = getArmor();
    if (armor.id !== "none"){
      ctx.strokeStyle = "#c0c0c0"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(0, r*0.15, r*0.7, r*0.8, 0, 0, Math.PI*2); ctx.stroke();
    }
    if (player.shieldTimer > 0){
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, r*1.4, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (player.speedBoostTimer > 0){
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = "#7fe3ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r*1.6, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.fillStyle = skinColor;
  ctx.beginPath(); ctx.ellipse(-r*0.75, r*0.1 + legOff*0.3, r*0.18, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.75, r*0.1 - legOff*0.3, r*0.18, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skinColor;
  ctx.beginPath(); ctx.arc(0, -r*0.55, r*0.7, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.stroke();
  ctx.fillStyle = hairColor;
  if (isPlayer){
    ctx.beginPath(); ctx.arc(0, -r*0.55, r*0.72, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillRect(-r*0.72, -r*0.55, r*0.2, r*0.9);
    ctx.fillRect(r*0.52, -r*0.55, r*0.2, r*0.9);
    ctx.strokeStyle = "#3a1a00"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-r*0.28, -r*0.55, r*0.22, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.28, -r*0.55, r*0.22, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r*0.06, -r*0.55); ctx.lineTo(r*0.06, -r*0.55); ctx.stroke();
  } else if (npc && npc.isBoss){
    ctx.beginPath(); ctx.arc(0, -r*0.55, r*0.75, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#8a0000";
    ctx.beginPath(); ctx.arc(-r*0.3, -r*0.3, r*0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.3, -r*0.3, r*0.3, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, -r*0.7, r*0.7, Math.PI, Math.PI*2); ctx.fill();
  }
  let ex1 = -r*0.22, ex2 = r*0.22, ey = -r*0.55;
  if (dir === 1){ ex1 = -r*0.35; ex2 = -r*0.05; }
  if (dir === 3){ ex1 = r*0.05; ex2 = r*0.35; }
  if (dir === 2){ ey = -r*0.65; }
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(ex1, ey, r*0.13, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey, r*0.13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = npc && npc.isBoss ? "#ff0000" : "#000";
  ctx.beginPath(); ctx.arc(ex1, ey, r*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey, r*0.06, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#7a1a10"; ctx.lineWidth = 2;
  ctx.beginPath();
  if (isPlayer && player.attackCooldown > 12){
    ctx.fillStyle = "#7a1a10";
    ctx.ellipse(0, -r*0.32, r*0.18, r*0.12, 0, 0, Math.PI*2); ctx.fill();
  } else { ctx.arc(0, -r*0.35, r*0.15, 0, Math.PI); }
  ctx.stroke();
  if (isPlayer){
    const weapon = getWeapon();
    ctx.save();
    ctx.translate(r*0.7, r*0.15);
    if (weapon.id === "oil"){ ctx.fillStyle = "#ffb700"; ctx.fillRect(-r*0.18, -r*0.35, r*0.36, r*0.7); }
    else { ctx.font = r*0.9 + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(weapon.icon, 0, 0); }
    ctx.restore();
  }
  if (!isPlayer && npc && npc.hasWeapon){
    ctx.save();
    ctx.translate(r*0.7, r*0.15);
    ctx.font = r*0.7 + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🔫", 0, 0);
    ctx.restore();
  }
  if (isPlayer && player.hideTimer > 0){
    ctx.globalAlpha = 0.3; ctx.fillStyle = "#7fd4f0";
    ctx.beginPath(); ctx.arc(0, 0, r*1.5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (!isPlayer && npc && npc.health !== undefined && !npc.isBoss){
    const bw = r*2, bh = 5;
    const bx = cx - r, by = py - r*1.9;
    ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(bx, by, bw, bh);
    const hp = Math.max(0, npc.health / npc.maxHealth);
    ctx.fillStyle = hp > 0.5 ? "#4ade80" : hp > 0.25 ? "#ffd700" : "#ff3030";
    ctx.fillRect(bx, by, bw * hp, bh);
    ctx.fillStyle = "#ffb700";
    ctx.fillRect(bx, by + bh + 1, bw * (npc.oilLevel/100), 3);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "bold 10px Tahoma"; ctx.textAlign = "center";
    ctx.fillText(npc.name, cx, by - 4);
  }
}

function drawRooms(){
  rooms.forEach(room => {
    const rx = room.x - camera.x + camera.shakeX, ry = room.y - camera.y + camera.shakeY;
    if (rx > W || ry > H || rx + room.w < 0 || ry + room.h < 0) return;
    ctx.fillStyle = room.floor;
    ctx.fillRect(rx, ry, room.w, room.h);
    ctx.strokeStyle = "rgba(0,0,0,.05)"; ctx.lineWidth = 1;
    for (let x = 0; x < room.w; x += 60){ ctx.beginPath(); ctx.moveTo(rx+x, ry); ctx.lineTo(rx+x, ry+room.h); ctx.stroke(); }
    for (let y = 0; y < room.h; y += 60){ ctx.beginPath(); ctx.moveTo(rx, ry+y); ctx.lineTo(rx+room.w, ry+y); ctx.stroke(); }
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.font = "bold 16px Tahoma"; ctx.textAlign = "center";
    ctx.fillText(room.name, rx + room.w/2, ry + 25);
    const decoIcons = { tv:"📺", kitchen:"🍳", bath:"🚽", bed:"💐", gym:"🥋", oil:"🛢️", kids:"🧸", storage:"📦", yard:"🌳" };
    if (decoIcons[room.deco]){ ctx.font = "40px serif"; ctx.fillText(decoIcons[room.deco], rx + room.w/2, ry + room.h/2 + 15); }
  });
}

function drawObstacles(){
  obstacles.forEach(o => {
    const ox = o.x - camera.x + camera.shakeX, oy = o.y - camera.y + camera.shakeY;
    if (ox > W || oy > H || ox + o.w < 0 || oy + o.h < 0) return;
    if (o.color){
      ctx.fillStyle = o.color; ctx.fillRect(ox, oy, o.w, o.h);
      ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 2;
      ctx.strokeRect(ox, oy, o.w, o.h);
    } else {
      ctx.fillStyle = "#5a3a1a"; ctx.fillRect(ox, oy, o.w, o.h);
      ctx.fillStyle = "rgba(255,255,255,.08)"; ctx.fillRect(ox+3, oy+3, o.w-6, 6);
      ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(ox, oy+o.h-6, o.w, 6);
    }
  });
}

function drawParticles(){
  particles.forEach(p => {
    const px = p.x - camera.x + camera.shakeX, py = p.y - camera.y + camera.shakeY;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(px, py, p.size * p.life, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawDamageNumbers(){
  ctx.font = "bold 20px Tahoma"; ctx.textAlign = "center";
  damageNumbers.forEach(d => {
    const dx = d.x - camera.x + camera.shakeX, dy = d.y - camera.y + camera.shakeY;
    ctx.globalAlpha = d.life / 60;
    ctx.fillStyle = "#ffd700"; ctx.strokeStyle = "#3a1a00"; ctx.lineWidth = 3;
    ctx.strokeText("-" + d.value, dx, dy);
    ctx.fillText("-" + d.value, dx, dy);
  });
  ctx.globalAlpha = 1;
}

function drawBullets(){
  bullets.forEach(b => {
    const bx = b.x - camera.x + camera.shakeX, by = b.y - camera.y + camera.shakeY;
    ctx.fillStyle = b.owner === "enemy" ? "#ff6b6b" : "#7fe3ff";
    ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  });
}

function drawPrizeBoxes(){
  prizeBoxes.forEach(b => {
    const bx = b.x - camera.x + camera.shakeX, by = b.y - camera.y + camera.shakeY + Math.sin(b.anim) * 3;
    if (bx < -50 || bx > W + 50 || by < -50 || by > H + 50) return;
    const grad = ctx.createRadialGradient(bx, by, 0, bx, by, 30);
    grad.addColorStop(0, "rgba(255,215,0,.9)");
    grad.addColorStop(1, "rgba(255,215,0,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(bx, by, 30, 0, Math.PI*2); ctx.fill();
    const icons = { health:"❤️", speed:"⚡", shield:"🛡️", coin:"💰" };
    ctx.font = "30px serif"; ctx.textAlign = "center";
    ctx.fillText(icons[b.type] || "🎁", bx, by + 10);
  });
}

function drawItems(){
  items.forEach(it => {
    const ix = it.x - camera.x + camera.shakeX, iy = it.y - camera.y + camera.shakeY;
    if (ix < -50 || ix > W + 50 || iy < -50 || iy > H + 50) return;
    const grad = ctx.createRadialGradient(ix, iy, 0, ix, iy, 40);
    grad.addColorStop(0, "rgba(127,227,255,.9)");
    grad.addColorStop(1, "rgba(127,227,255,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(ix, iy, 40, 0, Math.PI*2); ctx.fill();
    ctx.font = "36px serif"; ctx.textAlign = "center";
    ctx.fillText("💎", ix, iy + 12);
  });
}

function drawCrosshair(){
  const cx = player.x - camera.x + camera.shakeX;
  const cy = player.y - camera.y + camera.shakeY;
  const dirAngles = [Math.PI/2, Math.PI, -Math.PI/2, 0];
  const ang = dirAngles[player.dir];
  const weapon = getWeapon();
  ctx.save();
  ctx.globalAlpha = autoHuntMode ? 0.35 : 0.15;
  ctx.fillStyle = autoHuntMode ? "#ff6b00" : "#ffd700";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, weapon.range, ang - Math.PI/7, ang + Math.PI/7);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function render(){
  ctx.fillStyle = "#1a1a2a"; ctx.fillRect(0, 0, W, H);
  drawRooms();
  drawItems();
  drawObstacles();
  drawPrizeBoxes();
  npcs.forEach(n => {
    if (n.state === "defeated" && n.defeatedTimer <= 0) return;
    drawCharacter(n.x, n.y, n.r, n, n.dir, n.walkFrame, n.hitFlash, false);
  });
  if (boss && boss.state !== "defeated"){
    drawCharacter(boss.x, boss.y, boss.r, boss, boss.dir, boss.walkFrame, boss.hitFlash, false);
  }
  drawCharacter(player.x, player.y, player.r, null, player.dir, player.walkFrame, player.hitFlash, true);
  drawBullets();
  drawCrosshair();
  drawParticles();
  drawDamageNumbers();
  if (player.hitFlash > 0){
    ctx.fillStyle = `rgba(255,0,0,${player.hitFlash/40})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (autoHuntMode){
    ctx.strokeStyle = "rgba(255,100,0,.6)";
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W-6, H-6);
  }
  if (combo > 1){
    ctx.font = "bold 32px Tahoma"; ctx.textAlign = "center";
    ctx.fillStyle = "#ffd700"; ctx.strokeStyle = "#3a1a00"; ctx.lineWidth = 4;
    ctx.strokeText("کمبو x" + combo, W/2, 140);
    ctx.fillText("کمبو x" + combo, W/2, 140);
  }
}

// ============ MINIMAP ============
const mmCanvas = document.getElementById("minimapCanvas");
const mctx = mmCanvas.getContext("2d");
const MM_W = 200, MM_H = 160;

function drawMinimap(){
  mctx.fillStyle = "rgba(0,0,0,.85)"; mctx.fillRect(0, 0, MM_W, MM_H);
  const sx = MM_W / WORLD.w, sy = MM_H / WORLD.h;
  rooms.forEach(r => {
    mctx.fillStyle = "rgba(120,80,40,.6)";
    mctx.fillRect(r.x*sx, r.y*sy, r.w*sx, r.h*sy);
    mctx.strokeStyle = "rgba(255,215,0,.4)"; mctx.lineWidth = 1;
    mctx.strokeRect(r.x*sx, r.y*sy, r.w*sx, r.h*sy);
  });
  npcs.forEach(n => {
    if (n.state === "defeated") return;
    mctx.fillStyle = autoHuntMode ? "#ff6b00" : "#ff6b6b";
    mctx.beginPath(); mctx.arc(n.x*sx, n.y*sy, 3, 0, Math.PI*2); mctx.fill();
  });
  if (boss && boss.state !== "defeated"){
    mctx.fillStyle = "#8a0000";
    mctx.beginPath(); mctx.arc(boss.x*sx, boss.y*sy, 6, 0, Math.PI*2); mctx.fill();
    mctx.strokeStyle = "#ffd700"; mctx.lineWidth = 2; mctx.stroke();
  }
  prizeBoxes.forEach(b => {
    mctx.fillStyle = "#ffd700";
    mctx.beginPath(); mctx.arc(b.x*sx, b.y*sy, 2, 0, Math.PI*2); mctx.fill();
  });
  mctx.fillStyle = "#ffd700";
  mctx.beginPath(); mctx.arc(player.x*sx, player.y*sy, 4, 0, Math.PI*2); mctx.fill();
  mctx.strokeStyle = "#fff"; mctx.lineWidth = 1; mctx.stroke();
}

// ============ HUD ============
function updateHUD(){
  const hp = (player.health / player.maxHealth) * 100;
  document.getElementById("healthFill").style.width = hp + "%";
  document.getElementById("healthText").textContent = `❤️ ${Math.round(player.health)}/${player.maxHealth}`;
  const mp = (player.mana / player.maxMana) * 100;
  document.getElementById("manaFill").style.width = mp + "%";
  document.getElementById("coinsVal").textContent = gameState.coins;
}

// ============ SHOP UI ============
let currentShopTab = "weapons";

function renderShop(){
  document.getElementById("shopCoinsVal").textContent = gameState.coins;
  const container = document.getElementById("shopItems");
  container.innerHTML = "";
  let items = [], owned = [], equipped = "";
  if (currentShopTab === "weapons"){ items = SHOP_WEAPONS; owned = gameState.ownedWeapons; equipped = gameState.equippedWeapon; }
  else if (currentShopTab === "armor"){ items = SHOP_ARMOR; owned = gameState.ownedArmors; equipped = gameState.equippedArmor; }
  else if (currentShopTab === "skins"){ items = SHOP_SKINS; owned = gameState.ownedSkins; equipped = gameState.equippedSkin; }
  else if (currentShopTab === "powerups"){ items = SHOP_POWERUPS; owned = gameState.ownedPowerups; equipped = ""; }
  else { items = SHOP_CONSUMABLES; owned = []; equipped = ""; }
  items.forEach(item => {
    const isConsumable = currentShopTab === "consumables";
    const isOwned = isConsumable ? (gameState.consumables[item.id] || 0) > 0 : owned.includes(item.id);
    const isEquipped = !isConsumable && equipped === item.id;
    const card = document.createElement("div");
    card.className = "shop-item" + (isOwned && !isConsumable ? " owned" : "") + (isEquipped ? " equipped" : "");
    card.innerHTML = `
      <div class="icon">${item.icon}</div>
      <div class="name">${item.name}</div>
      <div class="desc">${item.desc}</div>
      ${item.price > 0 ? `<div class="price">🪙 ${item.price}${isConsumable && isOwned ? ' (دارید: ' + gameState.consumables[item.id] + ')' : ''}</div>` : ""}
    `;
    const btn = document.createElement("button");
    if (isConsumable){
      btn.textContent = gameState.coins >= item.price ? "بخر" : "سکه کمه";
      btn.disabled = gameState.coins < item.price;
      btn.onclick = () => {
        if (gameState.coins >= item.price){
          gameState.coins -= item.price;
          gameState.consumables[item.id] = (gameState.consumables[item.id] || 0) + 1;
          saveGame(); renderShop(); updateHUD(); updateItemBtn();
          showDialog("خریداری شد! " + item.icon + " " + item.name, 2000, 1.5, 1);
        }
      };
    } else if (isOwned && currentShopTab !== "powerups"){
      if (isEquipped){ btn.textContent = "✓ انتخاب شده"; btn.disabled = true; }
      else {
        btn.textContent = "انتخاب کن";
        btn.onclick = () => {
          if (currentShopTab === "weapons") gameState.equippedWeapon = item.id;
          if (currentShopTab === "armor"){ gameState.equippedArmor = item.id; updatePlayerStats(); }
          if (currentShopTab === "skins") gameState.equippedSkin = item.id;
          saveGame(); renderShop(); updateHUD();
        };
      }
    } else if (isOwned){
      btn.textContent = "✓ خریداری شده"; btn.disabled = true;
    } else {
      btn.textContent = gameState.coins >= item.price ? "بخر" : "سکه کمه";
      btn.disabled = gameState.coins < item.price;
      btn.onclick = () => {
        if (gameState.coins >= item.price){
          gameState.coins -= item.price;
          if (currentShopTab === "weapons") gameState.ownedWeapons.push(item.id);
          if (currentShopTab === "armor") gameState.ownedArmors.push(item.id);
          if (currentShopTab === "skins") gameState.ownedSkins.push(item.id);
          if (currentShopTab === "powerups") gameState.ownedPowerups.push(item.id);
          saveGame(); renderShop(); updateHUD(); checkAchievements();
          showDialog("خریداری شد! " + item.icon + " " + item.name, 2000, 1.5, 1);
        }
      };
    }
    card.appendChild(btn);
    container.appendChild(card);
  });
}

// ============ ACHIEVEMENTS UI ============
function renderAchievements(){
  const container = document.getElementById("achList");
  container.innerHTML = "";
  ACHIEVEMENTS.forEach(a => {
    const unlocked = gameState.unlockedAchievements.includes(a.id);
    const item = document.createElement("div");
    item.className = "achievement-item " + (unlocked ? "unlocked" : "locked");
    item.innerHTML = `
      <div class="ach-icon">${unlocked ? a.icon : "🔒"}</div>
      <div class="ach-info">
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${a.desc}</div>
      </div>
      <div class="ach-status">${unlocked ? "✓" : "قفل"}</div>
    `;
    container.appendChild(item);
  });
}

// ============ SCOREBOARD UI ============
function renderScoreboard(){
  const container = document.getElementById("scoreList");
  container.innerHTML = "";
  if (gameState.highScores.length === 0){
    container.innerHTML = '<div style="text-align:center;color:#888;padding:20px">هنوز امتیازی ثبت نشده</div>';
    return;
  }
  const sorted = [...gameState.highScores].sort((a,b) => b.score - a.score);
  sorted.slice(0, 20).forEach((s, i) => {
    const item = document.createElement("div");
    item.className = "score-item";
    item.innerHTML = `
      <div class="rank">${i+1}</div>
      <div class="info">
        <div style="font-size:11px;color:#bbb">مرحله ${s.level} - ${s.date}</div>
      </div>
      <div class="val">${s.score} 🪙</div>
    `;
    container.appendChild(item);
  });
}

// ============ CHARACTER SELECTION ============
function renderCharSelect(){
  const container = document.getElementById("charSelect");
  container.innerHTML = "";
  CHARACTERS.forEach(c => {
    const card = document.createElement("div");
    card.className = "char-card" + (gameState.selectedCharacter === c.id ? " selected" : "");
    card.innerHTML = `
      <div class="emoji">${c.emoji}</div>
      <div class="name">${c.name}</div>
      <div class="desc">${c.desc}</div>
    `;
    card.onclick = () => {
      gameState.selectedCharacter = c.id;
      saveGame();
      renderCharSelect();
    };
    container.appendChild(card);
  });
}

  document.getElementById("closeAch").style.display = "none";
});

  document.getElementById("scoreScreen").classList.remove("show");

  checkAchievements();

// ============ GAME LOOP ============
let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;
  update();
  render();
  drawMinimap();
  requestAnimationFrame(loop);
}

  speechSynthesis.onvoiceschanged = () => findPersianVoice();
  findPersianVoice();
}
buildLevel(1);
updatePlayerStats();
updateHUD();
updateItemBtn();
renderCharSelect();
requestAnimationFrame(loop);

})();
