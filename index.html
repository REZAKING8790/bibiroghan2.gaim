<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>🛢️ بی‌بی روغن - نسخه پیشرفته</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Tahoma,sans-serif;overscroll-behavior:none;position:fixed}
#c{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:1;background:#1a1a2a}

#hud{position:fixed;top:6px;left:6px;right:6px;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:12px;color:#fff}
.hud-box{background:rgba(0,0,0,.8);border:2px solid rgba(255,215,0,.5);border-radius:10px;padding:5px 9px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
#hp{width:130px;height:15px;background:rgba(0,0,0,.6);border:2px solid #8a1a1a;border-radius:7px;overflow:hidden;position:relative}
#hpFill{height:100%;background:linear-gradient(90deg,#ff3030,#ff6b6b);width:100%;transition:width .15s}
#hpTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
#mp{width:130px;height:8px;background:rgba(0,0,0,.6);border:2px solid #1a5a8a;border-radius:4px;overflow:hidden;margin-top:3px}
#mpFill{height:100%;background:linear-gradient(90deg,#4aa8d0,#7fe3ff);width:100%;transition:width .15s}
#coinBox{font-size:14px;font-weight:bold;color:#ffd700}

#bossBar{position:fixed;top:50px;left:50%;transform:translateX(-50%);width:min(80vw,500px);height:22px;background:rgba(0,0,0,.85);border:3px solid #ff3030;border-radius:12px;overflow:hidden;z-index:12;display:none;box-shadow:0 0 30px rgba(255,0,0,.6)}
#bossBar.on{display:block}
#bossFill{height:100%;background:linear-gradient(90deg,#8a0000,#ff3030,#ff6b6b);width:100%;transition:width .2s}
#bossTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:bold}

#joy{position:fixed;width:130px;height:130px;border-radius:50%;border:4px solid rgba(255,215,0,.8);background:rgba(0,0,0,.5);opacity:0;pointer-events:none;z-index:25;transition:opacity .12s;box-shadow:0 0 25px rgba(255,215,0,.6)}
#joy.on{opacity:1}
#knob{position:absolute;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe066,#ffb700);border:3px solid #7a5228;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(0,0,0,.6)}

.btn{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.6);border:3px solid;z-index:30;touch-action:manipulation}
.btn:active{transform:scale(.92)}
#atk{right:16px;bottom:150px;width:80px;height:80px;background:radial-gradient(circle at 30% 30%,#ff9e4a,#e67520);border-color:#7a3a00;font-size:38px}
#atk::after{content:'🛢️'}
#voice{right:16px;bottom:55px;width:70px;height:70px;background:radial-gradient(circle at 30% 30%,#7ed6a0,#3aa76d);border-color:#1a6a3a;font-size:32px}
#voice::after{content:'🎤'}
#voice.listening{animation:mic .8s infinite;background:radial-gradient(circle at 30% 30%,#ff3030,#a00000)}
@keyframes mic{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#shop{right:110px;bottom:55px;width:62px;height:62px;background:radial-gradient(circle at 30% 30%,#c8a8f0,#8a6ac8);border-color:#3a1a5a;font-size:30px}
#shop::after{content:'🏪'}
#item{right:110px;bottom:130px;width:58px;height:58px;background:radial-gradient(circle at 30% 30%,#ffe066,#e6a800);border-color:#7a4a00;font-size:26px;display:none;position:relative}
#item.on{display:flex}
#item::after{content:'💊'}
#item .cnt{position:absolute;top:-6px;right:-6px;background:#ff3030;color:#fff;font-size:11px;font-weight:bold;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
#snd{top:8px;right:8px;width:40px;height:40px;background:radial-gradient(circle at 30% 30%,#ffe066,#ffb700);border-color:#7a5228;font-size:18px;z-index:40}
#snd.off{background:radial-gradient(circle at 30% 30%,#888,#555)}
#menu{top:8px;left:8px;width:40px;height:40px;background:radial-gradient(circle at 30% 30%,#7fd4f0,#3a8ac8);border-color:#1a4a88;font-size:20px;z-index:40}

#dlg{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);background:rgba(2,10,22,.95);border:3px solid #ffd700;border-radius:14px;padding:10px 18px;color:#fff;font-size:14px;font-weight:bold;text-align:center;max-width:88vw;min-width:180px;z-index:60;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 0 30px rgba(255,215,0,.5)}
#dlg.on{opacity:1}
#dlg::before{content:attr(data-sp);position:absolute;top:-12px;right:14px;background:#ffd700;color:#3a1a00;padding:2px 10px;border-radius:8px;font-size:11px}

#mini{position:fixed;top:54px;right:8px;width:100px;height:80px;background:rgba(0,0,0,.6);border:2px solid rgba(255,215,0,.5);border-radius:8px;z-index:15;overflow:hidden;pointer-events:none}
#lvlInfo{position:fixed;top:54px;left:8px;z-index:11;background:rgba(0,0,0,.75);border:2px solid rgba(255,215,0,.5);border-radius:10px;padding:5px 10px;color:#fff;font-size:12px;font-weight:bold;display:none;pointer-events:none;max-width:200px}
#lvlInfo.on{display:block}
#autohunt{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(255,60,0,.9);border:3px solid #ffd700;border-radius:12px;padding:6px 16px;color:#fff;font-size:13px;font-weight:bold;display:none;pointer-events:none}
#autohunt.on{display:block}

/* Pets display */
#pets{position:fixed;bottom:8px;left:8px;z-index:20;display:flex;gap:6px;pointer-events:none}
.petIcon{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.7);border:2px solid #ffd700;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 15px rgba(255,215,0,.5)}

.panel{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:150;display:none;flex-direction:column;color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:12px 12px 90px}
.panel.on{display:flex}
.panel h2{font-size:20px;text-align:center;color:#ffd700;margin-bottom:8px;position:sticky;top:0;background:rgba(0,0,0,.96);padding:8px 0;z-index:2}
.panel-coins{text-align:center;font-size:16px;color:#ffe066;margin-bottom:10px;font-weight:bold}
.tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;position:sticky;top:44px;background:rgba(0,0,0,.96);padding:6px 0;z-index:2}
.tab{padding:7px 12px;background:rgba(60,40,20,.8);border:2px solid rgba(255,200,100,.4);border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;color:#fff;touch-action:manipulation}
.tab.on{background:linear-gradient(180deg,#ffe066,#ffb700);color:#3a1a00}
#shopItems{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sItem{background:rgba(40,20,60,.85);border:2px solid rgba(255,200,100,.4);border-radius:12px;padding:8px;text-align:center}
.sItem.owned{border-color:#4ade80}
.sItem.equip{border-color:#ffd700;box-shadow:0 0 20px rgba(255,215,0,.6)}
.sItem .ic{font-size:32px;margin-bottom:2px}
.sItem .nm{font-size:12px;font-weight:bold;margin-bottom:3px}
.sItem .ds{font-size:9px;color:#bbb;margin-bottom:5px;line-height:1.3}
.sItem .pr{font-size:11px;color:#ffe066;font-weight:bold;margin-bottom:5px}
.sItem button{width:100%;padding:6px;font-family:inherit;font-size:11px;font-weight:bold;color:#fff;background:rgba(120,60,200,.9);border:2px solid rgba(255,255,255,.3);border-radius:7px;cursor:pointer;touch-action:manipulation}
.sItem button:disabled{background:rgba(60,60,60,.9);cursor:not-allowed}
.closeBtn{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:12px 40px;font-family:inherit;font-size:15px;font-weight:bold;color:#3a1a00;background:linear-gradient(180deg,#ffe066,#ffb700);border:3px solid #7a5228;border-radius:14px;cursor:pointer;z-index:151;touch-action:manipulation;display:none}
.closeBtn.on{display:block}

#menuPanel{position:fixed;top:54px;left:8px;z-index:50;display:none;flex-direction:column;gap:6px}
#menuPanel.on{display:flex}
#menuPanel button{padding:9px 14px;font-family:inherit;font-size:13px;font-weight:bold;color:#fff;background:rgba(40,20,10,.95);border:2px solid rgba(255,200,100,.6);border-radius:10px;cursor:pointer;touch-action:manipulation}

/* Main menu */
#mainMenu{position:fixed;inset:0;background:linear-gradient(180deg,#0a1a2a,#1a0a2a,#0a1a2a);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff;gap:14px;overflow-y:auto}
#mainMenu.off{display:none}
#mainMenu .logo{font-size:90px;animation:bn 1.5s infinite alternate}
@keyframes bn{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-15px) rotate(5deg)}}
#mainMenu h1{font-size:28px;background:linear-gradient(45deg,#ffd700,#ff9e4a,#ff6b9d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.modeBtn{width:min(90vw,360px);padding:20px;font-size:18px;font-weight:bold;font-family:inherit;color:#fff;border:3px solid;border-radius:20px;cursor:pointer;touch-action:manipulation;text-align:right;display:flex;align-items:center;gap:14px;transition:transform .15s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.modeBtn:active{transform:scale(.96)}
.modeBtn .mIcon{font-size:44px}
.modeBtn .mInfo{flex:1}
.modeBtn .mTitle{font-size:20px;font-weight:bold;margin-bottom:4px}
.modeBtn .mDesc{font-size:12px;opacity:.85;line-height:1.4}
#modeAdv{background:linear-gradient(135deg,#e67520,#ff9e4a);border-color:#7a3a00}
#modeBR{background:linear-gradient(135deg,#8a2848,#c85888);border-color:#5a1830}
#modeEnd{background:linear-gradient(135deg,#3a5a88,#5a8ac8);border-color:#1a3a68}

#start{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff;gap:14px}
#start.off{display:none}
#start .big{font-size:80px}
#start h1{font-size:24px;color:#ffd700}
#start p{font-size:13px;color:#ccc;line-height:1.7;max-width:340px}
.startBtn{padding:14px 40px;font-size:18px;font-weight:bold;font-family:inherit;color:#3a1a00;background:linear-gradient(180deg,#ffe066,#ffb700);border:4px solid #7a5228;border-radius:18px;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 20px rgba(255,180,0,.5)}
.secBtn{padding:10px 24px;font-size:14px;font-weight:bold;font-family:inherit;color:#fff;background:linear-gradient(180deg,#7fd4f0,#3a8ac8);border:3px solid #1a4a88;border-radius:14px;cursor:pointer;touch-action:manipulation;margin:4px}

#lvlEnd{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff;gap:16px;overflow-y:auto}
#lvlEnd.on{display:flex}
#lvlEnd .big{font-size:80px}
#lvlEnd h1{font-size:26px;color:#ffd700}
#lvlEnd .st{font-size:16px;margin:3px}
#lvlEnd button{padding:12px 26px;font-family:inherit;font-size:15px;font-weight:bold;color:#3a1a00;background:linear-gradient(180deg,#ffe066,#ffb700);border:3px solid #7a5228;border-radius:12px;cursor:pointer;margin:3px;touch-action:manipulation}

/* Power selection */
#powerSelect{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:210;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff;gap:14px;overflow-y:auto}
#powerSelect.on{display:flex}
#powerSelect h2{font-size:24px;color:#ffd700;margin-bottom:10px;text-shadow:0 0 20px rgba(255,215,0,.7)}
.powerCards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.powerCard{padding:16px;background:linear-gradient(135deg,#4a2a5a,#6a3a7a);border:3px solid #ffd700;border-radius:16px;cursor:pointer;touch-action:manipulation;text-align:right;display:flex;align-items:center;gap:12px;transition:transform .15s;box-shadow:0 4px 15px rgba(255,215,0,.3)}
.powerCard:active{transform:scale(.97)}
.powerCard .pIcon{font-size:44px}
.powerCard .pInfo{flex:1}
.powerCard .pName{font-size:17px;font-weight:bold;color:#ffd700;margin-bottom:4px}
.powerCard .pDesc{font-size:12px;color:#ddd;line-height:1.4}

@media (max-aspect-ratio:3/4){
  #atk{width:72px;height:72px;bottom:140px}
  #voice{width:64px;height:64px;bottom:55px}
  #shop{right:105px;bottom:55px;width:58px;height:58px}
  #item{right:105px;bottom:128px;width:54px;height:54px}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div>
    <div class="hud-box">
      <div id="hp"><div id="hpFill"></div><div id="hpTxt">❤️ 100/100</div></div>
      <div id="mp"><div id="mpFill"></div></div>
    </div>
  </div>
  <div class="hud-box" id="coinBox">🪙 <span id="coins">0</span></div>
</div>

<div id="bossBar"><div id="bossFill"></div><div id="bossTxt">🐉 اژدهای روغن</div></div>
<div id="lvlInfo">مرحله <span id="lvlN">1</span> - <span id="lvlGoal">0/6</span></div>
<div id="autohunt">🔥 شکار خودکار فعال!</div>
<div id="mini"><canvas id="miniC" width="200" height="160" style="width:100%;height:100%;display:block"></canvas></div>
<div id="joy"><div id="knob"></div></div>
<div id="pets"></div>

<div class="btn" id="atk"></div>
<div class="btn" id="voice"></div>
<div class="btn" id="shop"></div>
<div class="btn" id="item"><span class="cnt" id="itemCnt">0</span></div>
<div class="btn" id="snd">🔊</div>
<div class="btn" id="menu">☰</div>

<div id="menuPanel">
  <button id="mHelp">📖 راهنما</button>
  <button id="mMainMenu">🏠 منوی اصلی</button>
  <button id="mReset">🔄 ریست</button>
</div>

<div id="dlg" data-sp="بی‌بی روغن"></div>

<!-- Main Menu -->
<div id="mainMenu">
  <div class="logo">🛢️</div>
  <h1>بی‌بی روغن</h1>
  <button class="modeBtn" id="modeAdv">
    <div class="mIcon">⚔️</div>
    <div class="mInfo">
      <div class="mTitle">حالت ماجراجویی</div>
      <div class="mDesc">۶۰ مرحله - نقشه‌های مختلف - باس نهایی</div>
    </div>
  </button>
  <button class="modeBtn" id="modeBR">
    <div class="mIcon">👑</div>
    <div class="mInfo">
      <div class="mTitle">بتل رویال</div>
      <div class="mDesc">۱۰ بازیکن - آخرین نفر برنده</div>
    </div>
  </button>
  <button class="modeBtn" id="modeEnd">
    <div class="mIcon">♾️</div>
    <div class="mInfo">
      <div class="mTitle">حالت بی‌نهایت</div>
      <div class="mDesc">سختی نامحدود - قدرت‌های ویژه</div>
    </div>
  </button>
</div>

<div id="start" class="off">
  <div class="big">🛢️</div>
  <h1 id="startTitle">آماده‌ای؟</h1>
  <p id="startDesc">
    <b style="color:#ffd700">🕹️ نیمه چپ: حرکت</b><br>
    <b style="color:#ff9e4a">🛢️: حمله</b><br>
    <b style="color:#7ed6a0">🎤: دستور صوتی</b>
  </p>
  <button class="startBtn" id="startBtn">شروع 🚀</button>
</div>

<!-- Shop -->
<div class="panel" id="shopPanel">
  <h2>🏪 فروشگاه</h2>
  <div class="panel-coins">🪙 <span id="shopCoins">0</span></div>
  <div class="tabs">
    <div class="tab on" data-t="weapons">🗡️ سلاح</div>
    <div class="tab" data-t="armor">🛡️ زره</div>
    <div class="tab" data-t="skins">👗 اسکین</div>
    <div class="tab" data-t="powerups">⭐ قدرت</div>
    <div class="tab" data-t="consumables">💊 مصرفی</div>
  </div>
  <div id="shopItems"></div>
</div>
<button class="closeBtn" id="closeShop">بستن 🔙</button>

<!-- Level End -->
<div id="lvlEnd">
  <div class="big" id="endEmoji">🎉</div>
  <h1 id="endTitle">آفرین!</h1>
  <div class="st" id="endMsg"></div>
  <div class="st">🪙 سکه: <span id="endCoins">0</span></div>
  <div class="st" id="endTime"></div>
  <div style="margin-top:10px">
    <button id="nextBtn">مرحله بعد ➡️</button>
    <button class="secBtn" id="endShopBtn">🏪 فروشگاه</button>
  </div>
</div>

<!-- Power Selection -->
<div id="powerSelect">
  <div style="font-size:60px">⚡</div>
  <h2>یک قدرت انتخاب کن!</h2>
  <div class="powerCards" id="powerCards"></div>
</div>

<script>

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 300));

  ],
  [

function buildLevel(num, isBR, isEndless){
  if (isBR){
    rooms = BR_LAYOUT;
    world = WORLD;
  } else if (isEndless){
    rooms = ENDLESS_LAYOUT;
    world = BIG_WORLD;
  } else {
    rooms = LAYOUTS[(num - 1) % LAYOUTS.length];
    world = WORLD;
  }
  const walls = [];
  walls.push({ x:0, y:0, w:world.w, h:30 });
  walls.push({ x:0, y:world.h-30, w:world.w, h:30 });
  walls.push({ x:0, y:0, w:30, h:world.h });
  walls.push({ x:world.w-30, y:0, w:30, h:world.h });
  for (let i = 0; i < rooms.length; i++){
    for (let j = i + 1; j < rooms.length; j++){
      const r1 = rooms[i], r2 = rooms[j];
      if (Math.abs(r1.x + r1.w - r2.x) < 5 || Math.abs(r2.x + r2.w - r1.x) < 5){
        const y1 = Math.max(r1.y, r2.y), y2 = Math.min(r1.y + r1.h, r2.y + r2.h);
        if (y2 > y1 + 100){
          const mid = (y1 + y2) / 2, ds = 130;
          const x = r1.x < r2.x ? r1.x + r1.w : r2.x + r2.w;
          walls.push({ x, y:y1, w:30, h:(mid - ds/2) - y1 });
          walls.push({ x, y:mid + ds/2, w:30, h:y2 - (mid + ds/2) });
        }
      }
      if (Math.abs(r1.y + r1.h - r2.y) < 5 || Math.abs(r2.y + r2.h - r1.y) < 5){
        const x1 = Math.max(r1.x, r2.x), x2 = Math.min(r1.x + r1.w, r2.x + r2.w);
        if (x2 > x1 + 100){
          const mid = (x1 + x2) / 2, ds = 130;
          const y = r1.y < r2.y ? r1.y + r1.h : r2.y + r2.h;
          walls.push({ x:x1, y, w:(mid - ds/2) - x1, h:30 });
          walls.push({ x:mid + ds/2, y, w:x2 - (mid + ds/2), h:30 });
        }
      }
    }
  }
  obstacles = walls.concat(FURNITURE);
}

function circleRectCollide(cx, cy, r, rect){
  const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - nx, dy = cy - ny;
  return dx*dx + dy*dy < r*r;
}
function collides(x, y, r){
  for (let i = 0; i < obstacles.length; i++){
    if (circleRectCollide(x, y, r, obstacles[i])) return true;
  }
  return false;
}
function findSafeSpot(room, radius){
  const cx = room.x + room.w / 2, cy = room.y + room.h / 2;
  if (!collides(cx, cy, radius)) return { x: cx, y: cy };
  for (let sy = room.y + 80; sy < room.y + room.h - 60; sy += 60){
    for (let sx = room.x + 80; sx < room.x + room.w - 60; sx += 60){
      if (!collides(sx, sy, radius)) return { x: sx, y: sy };
    }
  }
  return { x: cx, y: cy };
}

    return {
      enemyCount: Math.min(4 + i, 20),
      enemyHealth: Math.floor(50 * Math.pow(1.18, i)),
      enemySpeed: 0.6 + i * 0.06,
      enemyDamage: 2 + Math.floor(i / 2),
      enemyHasWeapon: i >= 2,
      hasBoss: (i + 1) % 5 === 0
    };
  }
  return {
    enemyCount: Math.min(3 + Math.floor(i * 0.5), 14),
    enemyHealth: 50 + i * 15,
    enemySpeed: 0.6 + i * 0.04,
    enemyDamage: 1 + Math.floor(i / 3),
    enemyHasWeapon: i >= 4,
    hasBoss: num % 10 === 0
  };
}

function updateBRPlayer(n){
  if (!n.alive) return;
  if (n.hitFlash > 0) n.hitFlash--;
  const dx = player.x - n.x, dy = player.y - n.y;
  const dist = Math.hypot(dx, dy);
  // AI: اگه بازیکن نزدیکه، حمله کن
  if (dist < 400){
    n.state = "chase";
  } else {
    n.state = "wander";
  }
  if (n.state === "chase" && dist < 90){
    if (n.weaponCD <= 0){
      // ضربه
      player.health -= 4;
      player.hitFlash = 8;
      playBeep("hurt");
      n.weaponCD = 60;
    }
  } else if (n.state === "chase" && dist < 300){
    if (n.weaponCD <= 0){
      const a = Math.atan2(dy, dx);
      bullets.push({ x: n.x, y: n.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, owner: "enemy", damage: 3, life: 120 });
      n.weaponCD = 80;
    }
  }
  if (n.weaponCD > 0) n.weaponCD--;

  if (n.state === "chase"){
    if (dist > 60){
      const a = Math.atan2(dy, dx);
      const sp = 1.5;
      let nx = n.x + Math.cos(a) * sp, ny = n.y + Math.sin(a) * sp;
      if (!collides(nx, n.y, n.r)) n.x = nx;
      if (!collides(n.x, ny, n.r)) n.y = ny;
      n.dir = Math.abs(Math.cos(a)) > Math.abs(Math.sin(a)) ? (Math.cos(a) > 0 ? 3 : 1) : (Math.sin(a) > 0 ? 0 : 2);
      n.walkFrame += 0.4;
    }
    return;
  }

  // wander
  n.stateTimer--;
  if (n.stateTimer <= 0){
    const room = rooms[Math.floor(Math.random() * rooms.length)];
    const spot = findSafeSpot(room, n.r + 5);
    n.targetX = spot.x; n.targetY = spot.y;
    n.stateTimer = 120 + Math.random() * 120;
  }
  const tdx = n.targetX - n.x, tdy = n.targetY - n.y;
  const td = Math.hypot(tdx, tdy);
  if (td > 10){
    const a = Math.atan2(tdy, tdx);
    const sp = 0.8;
    let nx = n.x + Math.cos(a) * sp, ny = n.y + Math.sin(a) * sp;
    if (!collides(nx, n.y, n.r)) n.x = nx;
    if (!collides(n.x, ny, n.r)) n.y = ny;
    n.dir = Math.abs(Math.cos(a)) > Math.abs(Math.sin(a)) ? (Math.cos(a) > 0 ? 3 : 1) : (Math.sin(a) > 0 ? 0 : 2);
    n.walkFrame += 0.25;
  }
}

}

function updatePets(){
  pets.forEach(p => {
    const data = PET_DATA[p.type];
    // دنبال بازیکن
    const dxP = player.x - p.x, dyP = player.y - p.y;
    const distP = Math.hypot(dxP, dyP);
    if (distP > 60){
      const a = Math.atan2(dyP, dxP);
      p.x += Math.cos(a) * 3;
      p.y += Math.sin(a) * 3;
    }
    // پیدا کردن دشمن
    if (p.cd > 0) { p.cd--; return; }
    let target = null, bestD = Infinity;
    const targets = enemies.concat(boss && boss.health > 0 ? [boss] : []);
    targets.forEach(n => {
      if (n.state === "defeated") return;
      const d = Math.hypot(n.x - p.x, n.y - p.y);
      if (d < data.range && d < bestD){ bestD = d; target = n; }
    });
    if (target){
      p.cd = data.rate;
      let dmg = data.damage;
      target.health -= dmg;
      target.hitFlash = 10;
      spawnParticles(target.x, target.y, data.color, 8);
      damagePopup(target.x, target.y - 20, dmg);
      playBeep("hit");
      if (target.health <= 0 && target.state !== "defeated"){
        target.state = "defeated";
        if (!target.isBoss) target.defeatedTimer = 90;
        let pts = target.isBoss ? 500 : 12;
        S.coins += pts; S.totalCoins += pts; S.kills++;
        combo++; comboTimer = 90;
        if (combo > S.maxCombo) S.maxCombo = combo;
        spawnParticles(target.x, target.y, "#7ed6a0", 20);
        if (!target.isBoss && Math.random() < 0.4) spawnPrize(target.x, target.y);
        if (target.isBoss){
          S.bossDefeated = true;
          document.getElementById("bossBar").classList.remove("on");
          playBeep("win");
          showDlg("🎉 اژدها کشته شد! 🏆", 4000, 1.6, 1);
        }
        save(); updateHUD(); checkLevelDone();
      }
    }
  });
}

const keys = {};

});

let joyOn = false, joyId = null;
let joyOX = 0, joyOY = 0, joyX = 0, joyY = 0;
const JOY_R = 65;
const joyEl = document.getElementById("joy");
const knobEl = document.getElementById("knob");

canvas.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (joyId !== null) return;
  if (e.clientX >= W / 2) return;
  joyId = e.pointerId;
  joyOn = true;
  joyOX = e.clientX; joyOY = e.clientY;
  joyX = e.clientX; joyY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  joyEl.style.left = (joyOX - 65) + "px";
  joyEl.style.top = (joyOY - 65) + "px";
  joyEl.classList.add("on");
  knobEl.style.transform = "translate(-50%,-50%)";
  e.preventDefault();
}, { passive: false });

canvas.addEventListener("pointermove", e => {
  if (e.pointerId !== joyId) return;
  joyX = e.clientX; joyY = e.clientY;
  const dx = joyX - joyOX, dy = joyY - joyOY;
  const dist = Math.hypot(dx, dy);
  let kx = dx, ky = dy;
  if (dist > JOY_R){
    joyOX = joyX - (dx / dist) * JOY_R;
    joyOY = joyY - (dy / dist) * JOY_R;
    joyEl.style.left = (joyOX - 65) + "px";
    joyEl.style.top = (joyOY - 65) + "px";
    kx = (dx / dist) * JOY_R; ky = (dy / dist) * JOY_R;
  }
  knobEl.style.transform = `translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`;
  e.preventDefault();
}, { passive: false });

function endPointer(e){
  if (e.pointerId !== joyId) return;
  joyId = null; joyOn = false;
  knobEl.style.transform = "translate(-50%,-50%)";
  joyEl.classList.remove("on");
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", endPointer);
canvas.addEventListener("contextmenu", e => e.preventDefault());

function getInput(){
  if (joyOn && joyId !== null){
    const dx = joyX - joyOX, dy = joyY - joyOY;
    const dist = Math.hypot(dx, dy);
    if (dist < 8) return { x:0, y:0 };
    const norm = Math.min(dist, JOY_R) / JOY_R;
    return { x:(dx/dist)*norm, y:(dy/dist)*norm };
  }
  let vx = 0, vy = 0;
  if (keys["w"] || keys["arrowup"]) vy -= 1;
  if (keys["s"] || keys["arrowdown"]) vy += 1;
  if (keys["a"] || keys["arrowleft"]) vx -= 1;
  if (keys["d"] || keys["arrowright"]) vx += 1;
  const m = Math.hypot(vx, vy);
  if (m > 0){ vx /= m; vy /= m; }
  return { x:vx, y:vy };
}

let soundOn = true, audioCtx = null;
function initAudio(){
  if (!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function playBeep(type){
  if (!soundOn || !audioCtx) return;
  const now = audioCtx.currentTime;
  const sounds = {
    attack: { type:"sawtooth", f:400, ef:800, dur:0.15, vol:0.1 },
    hit:    { type:"square", f:600, ef:200, dur:0.2, vol:0.15 },
    hurt:   { type:"sawtooth", f:200, ef:80, dur:0.25, vol:0.2 },
    bullet: { type:"square", f:800, ef:300, dur:0.1, vol:0.08 },
    coin:   { type:"sine", f:1200, ef:1600, dur:0.2, vol:0.1 },
    boss:   { type:"sawtooth", f:100, ef:50, dur:0.5, vol:0.3 }
  };
  const s = sounds[type];
  if (s){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = s.type;
    o.frequency.setValueAtTime(s.f, now);
    o.frequency.exponentialRampToValueAtTime(s.ef, now + s.dur);
    g.gain.setValueAtTime(s.vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + s.dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + s.dur);
  } else if (type === "win"){
    [500, 700, 900, 1200].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t = now + i * 0.1;
      o.type = "sine";
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.2);
    });
  }
}

function findFaVoice(){
  if (!("speechSynthesis" in window)) return null;
  const v = speechSynthesis.getVoices();
  return v.find(x => x.lang && x.lang.toLowerCase().startsWith("fa"))
      || v.find(x => x.lang && x.lang.toLowerCase().startsWith("ar"))
      || v[0] || null;
}
function speak(text, pitch, rate){
  if (!soundOn || !("speechSynthesis" in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voice = findFaVoice();
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : "fa-IR";
    u.pitch = pitch || 1.3;
    u.rate = rate || 0.9;
    speechSynthesis.speak(u);
  } catch(e){}
}
function showDlg(text, dur, pitch, rate){
  const d = document.getElementById("dlg");
  d.textContent = text;
  d.classList.add("on");
  clearTimeout(d._t);
  d._t = setTimeout(() => d.classList.remove("on"), dur || 3000);
  speak(text, pitch, rate);
}

let listening = false, recog = null;
function initRecog(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = "fa-IR"; r.continuous = true; r.interimResults = false;
  r.onresult = (e) => {
    const last = e.results[e.results.length - 1];
    if (last.isFinal) handleVoice(last[0].transcript.trim());
  };
  r.onerror = (e) => { if (e.error === "not-allowed") stopListening(); };
  r.onend = () => { if (listening) try { r.start(); } catch(e){} };
  return r;
}
function startListening(){
  if (!recog) recog = initRecog();
  if (!recog){ showDlg("مرورگر پشتیبانی نمی‌کنه!", 3500, 1.4, 0.95); return; }
  try { recog.start(); listening = true; document.getElementById("voice").classList.add("listening"); } catch(e){}
}
function stopListening(){
  if (recog && listening){
    listening = false;
    try { recog.stop(); } catch(e){}
    document.getElementById("voice").classList.remove("listening");
  }
}

/* ============================================================
   ============ PARSER ============
   ============================================================ */
function parse(text){
  const t = text.replace(/[،.,؟!?؛;:]/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
  const p = { verbs:[], dirs:[], targets:[], counts:null, raw:t,
    isQ: /[؟?]/.test(text) || /چیه|کیه|کجاست|چند|چطور|چرا/.test(t),
    isHi: /سلام|درود|خوبی|چطوری/.test(t),
    isThx: /ممنون|مرسی|سپاس/.test(t) };
  const vp = [
    { v:"attackAll", re:/همه.*(دشمن|اهالی).*(نابود|بکش|بزن)|همه رو نابود|همه دشمنان/ },
    { v:"usePotion", re:/معجون|شفا|بخور|سپر بگیر|سرعت بگیر/ },
    { v:"sing", re:/آهنگ|بخون|آواز|بخوان|شعر/ },
    { v:"curse", re:/نفرین|نفرین کن|لعن|لعن کن|دشنام/ },
    { v:"powerUp", re:/قدرت ویژه|قدرت خودت|قدرتت|قدرت خاص|قدرت فعال|قدرتت رو فعال/ },
    { v:"attack", re:/حمله|بزن|شلیک|روغن بزن|بکش|نابود|له کن/ },
    { v:"seek", re:/بگرد|پیدا کن|دنبال|تعقیب|شکار|گرفتن/ },
    { v:"stop", re:/بایست|وایسا|توقف|بسه|صبر/ },
    { v:"move", re:/برو|راه بیفت|حرکت کن|بیا|بدو/ },
    { v:"dance", re:/برقص|رقص/ },
    { v:"hide", re:/قایم|پنهان/ },
    { v:"jump", re:/بپر|جهش/ },
    { v:"heal", re:/درمان|شفا/ }
  ];
  vp.forEach(x => { if (x.re.test(t)) p.verbs.push(x.v); });
  if (/بالا|شمال|جلو/.test(t)) p.dirs.push("up");
  if (/پایین|جنوب|عقب/.test(t)) p.dirs.push("down");
  if (/چپ|غرب/.test(t)) p.dirs.push("left");
  if (/راست|شرق/.test(t)) p.dirs.push("right");
  if (/مریم|گلی/.test(t)) p.targets.push("مریم");
  if (/زهرا|کماندو/.test(t)) p.targets.push("زهرا");
  if (/اسماع/.test(t)) p.targets.push("اسماع");
  if (/حنانه/.test(t)) p.targets.push("حنانه");
  if (/همه|تمام|همگی|اهالی/.test(t)) p.targets.push("all");
  if (/نزدیک/.test(t)) p.targets.push("nearest");
  const c = {یک:1,یه:1,دو:2,سه:3,چهار:4,پنج:5};
  for (const [w, n] of Object.entries(c)) if (new RegExp("\\b"+w+"\\b").test(t)) { p.counts = n; break; }
  return p;
}

   ============================================================ */
function getAlive(){
  if (gameMode === MODES.BATTLE_ROYALE) return brPlayers.filter(p => p.alive);
  return enemies.filter(e => e.state !== "defeated");
}
function nearestNPC(){
  const a = getAlive();
  if (!a.length) return boss && boss.health > 0 ? boss : null;
  let best = a[0], bd = Infinity;
  a.forEach(n => { const d = Math.hypot(n.x - player.x, n.y - player.y); if (d < bd){ bd = d; best = n; } });
  return best;
}

function handleVoice(text){
  const p = parse(text);
  if (p.verbs.includes("attackAll")){ startAutoHunt(); return; }
  if (p.verbs.includes("usePotion")){ usePotion(); return; }
  if (p.verbs.includes("sing")){
    const song = SONGS[Math.floor(Math.random() * SONGS.length)];
    showDlg(song, 6000, 1.6, 0.8);
    return;
  }
  if (p.verbs.includes("curse")){
    const curse = CURSES[Math.floor(Math.random() * CURSES.length)];
    showDlg(curse, 5000, 1.5, 0.9);
    playBeep("boss");
    return;
  }
  if (p.verbs.includes("powerUp")){
    if (pets.length > 0){
      showDlg("قدرتم فعاله! " + pets.map(x => x.icon).join(" "), 3000, 1.5, 1);
    } else {
      showDlg("هنوز قدرت خاصی ندارم! تو حالت بی‌نهایت انتخاب کن!", 3500, 1.4, 0.9);
    }
    return;
  }
  if (p.isHi){ showDlg("سلام عزیزم! روغن می‌خوای؟ 🛢️", 2500, 1.55, 0.85); return; }
  if (p.isThx){ showDlg("خواهش می‌کنم! 🌹", 2200, 1.55, 0.9); return; }
  if (p.isQ && p.verbs.length === 0){
    if (/چند/.test(p.raw)){ showDlg(`${getAlive().length} نفر موندن! 💪`, 3000, 1.5, 0.9); return; }
    if (/کجا|کدوم/.test(p.raw)){
      const n = nearestNPC();
      if (n){ const d = Math.round(Math.hypot(n.x - player.x, n.y - player.y)); showDlg(`${n.name} - ${d} قدم! 🎯`, 3500, 1.5, 0.9); }
      else showDlg("کسی نمونده! 🎉", 2000, 1.5, 0.9);
      return;
    }
    showDlg("نفهمیدم! 🤔", 2500, 1.5, 0.9);
    return;
  }
  if (p.verbs.length === 0 && p.targets.length === 0){
    showDlg("بگو: همه دشمنان رو نابود کن!", 3000, 1.5, 0.9);
    return;
  }
  if (p.verbs.includes("stop")){
    stopAutoHunt();
    autoMoveTimer = 0; autoMoveTarget = null;
    enemies.forEach(n => { n.state = "wander"; });
    showDlg("وایسادم! 🛑", 1500, 1.5, 0.9);
    return;
  }
  if (p.verbs.includes("dance")){
    showDlg("بزن بریم! 💃", 2000, 1.6, 1);
    for (let i = 0; i < 12; i++) setTimeout(() => spawnParticles(player.x + (Math.random()-0.5)*80, player.y + (Math.random()-0.5)*80, "#ff6b9d", 3), i * 100);
    return;
  }
  if (p.verbs.includes("hide")){ showDlg("قایم شدم! 🤫", 2000, 1.4, 0.85); return; }
  if (p.verbs.includes("jump")){
    showDlg("هوپ! 🦘", 1200, 1.7, 1.2);
    for (let i = 0; i < 8; i++) spawnParticles(player.x, player.y, "#7fd4f0", 2);
    return;
  }
  if (p.verbs.includes("heal")){
    player.health = player.maxHealth; updateHUD();
    spawnParticles(player.x, player.y, "#7ed6a0", 20);
    showDlg("درمان شدم! 💚", 2000, 1.5, 0.9);
    return;
  }
  if (p.verbs.includes("move") && p.dirs.length > 0){
    const dirVecs = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
    const d = dirVecs[p.dirs[0]];
    if (d){
      moveTowards(player.x + d.x * 400, player.y + d.y * 400);
      const dirNames = { up:"بالا", down:"پایین", left:"چپ", right:"راست" };
      showDlg("دارم می‌رم " + dirNames[p.dirs[0]] + "! 🚶", 1500, 1.5, 0.9);
    }
    return;
  }
  if (p.verbs.includes("seek")){
    let t = null;
    if (p.targets.includes("all") || p.targets.includes("nearest")) t = nearestNPC();
    else for (const tid of p.targets){ t = enemies.find(e => e.name.includes(tid) && e.state !== "defeated"); if (t) break; }
    if (!t) t = nearestNPC();
    if (!t){ showDlg("کسی نمونده! 🎉", 2000, 1.5, 0.9); return; }
    moveTowards(t.x, t.y);
    showDlg("میام دنبال " + t.name + "! 🏃", 2000, 1.55, 0.9);
    return;
  }
  if (p.verbs.includes("attack")){
    const n = nearestNPC();
    if (n && Math.hypot(n.x - player.x, n.y - player.y) < 200){
      const ang = Math.atan2(n.y - player.y, n.x - player.x);
      if (Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang))) player.dir = Math.cos(ang) > 0 ? 3 : 1;
      else player.dir = Math.sin(ang) > 0 ? 0 : 2;
    }
    for (let i = 0; i < 3; i++) setTimeout(attack, i * 250);
    showDlg("روغن بخور! 🛢️", 2000, 1.6, 1);
    return;
  }
  showDlg("نفهمیدم! مثلاً: همه دشمنان رو نابود کن", 3000, 1.4, 0.9);
}

function moveTowards(nx, ny){ autoMoveTarget = { x:nx, y:ny }; autoMoveTimer = 300; }

function startAutoHunt(){
  if (autoHunt) return;
  const a = getAlive();
  if (a.length === 0 && !boss){ showDlg("همه نابود شدن! 🎉", 2500, 1.55, 0.9); return; }
  autoHunt = true; autoHuntTimer = 0; autoHuntAtkTimer = 0;
  document.getElementById("autohunt").classList.add("on");
  showDlg("باشه! همه‌شون رو نابود می‌کنم! 🔥", 2500, 1.6, 1);
}
function stopAutoHunt(){
  autoHunt = false;
  document.getElementById("autohunt").classList.remove("on");
}
function updateAutoHunt(){
  if (!autoHunt) return;
  autoHuntTimer++;
  if (autoHuntTimer > 3600){ stopAutoHunt(); return; }
  let t = nearestNPC();
  if (!t){ stopAutoHunt(); return; }
  const dx = t.x - player.x, dy = t.y - player.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 55){
    const speed = 5;
    const stepX = (dx / dist) * speed;
    const stepY = (dy / dist) * speed;
    let nx = player.x + stepX, ny = player.y + stepY;
    if (!collides(nx, player.y, player.r)) player.x = nx;
    if (!collides(player.x, ny, player.r)) player.y = ny;
    if (Math.abs(stepX) > Math.abs(stepY)) player.dir = stepX > 0 ? 3 : 1;
    else player.dir = stepY > 0 ? 0 : 2;
    player.walkFrame += 0.5;
  } else {
    const ang = Math.atan2(dy, dx);
    if (Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang))) player.dir = Math.cos(ang) > 0 ? 3 : 1;
    else player.dir = Math.sin(ang) > 0 ? 0 : 2;
    if (autoHuntAtkTimer <= 0){ attack(); autoHuntAtkTimer = 8; }
  }
  if (autoHuntAtkTimer > 0) autoHuntAtkTimer--;
}

/* ============================================================
   ============ COMBAT ============
   ============================================================ */
function attack(){
  if (player.attackCooldown > 0) return;
  if (player.mana < 5) return;
  player.attackCooldown = 16;
  player.mana = Math.max(0, player.mana - 5);
  playBeep("attack");
  const weapon = getWeapon();
  const dirAng = [Math.PI/2, Math.PI, -Math.PI/2, 0];
  const baseAng = dirAng[player.dir];
  const range = weapon.range;
  const spread = Math.PI / 3;

  // حمله به دشمن‌ها
  const targets = enemies.concat(boss && boss.health > 0 ? [boss] : []);
  // حمله به BR players
  const brTargets = brPlayers.filter(p => p.alive);
  const allTargets = targets.concat(brTargets);

  allTargets.forEach(n => {
    if (n.state === "defeated" || n.alive === false) return;
    const dx = n.x - player.x, dy = n.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > range) return;
    const ang = Math.atan2(dy, dx);
    let diff = Math.abs(ang - baseAng);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff < spread / 2 || dist < 40){
      let dmg = Math.floor((weapon.damage + Math.floor(Math.random() * 10)) * playerDamageMult);
      if (S.ownedPowerups.includes("crit") && Math.random() < 0.2) dmg *= 2;
      n.health -= dmg;
      n.hitFlash = 12;
      if (!n.isBoss && !n.isBR) n.oilLevel = Math.min(100, (1 - n.health / n.maxHealth) * 100);
      spawnParticles(n.x, n.y, "#ffb700", 10);
      damagePopup(n.x, n.y - 20, dmg);
      playBeep("hit");
      shakeAmount = Math.max(shakeAmount, 5);
      if (n.health <= 0 && n.state !== "defeated" && n.alive !== false){
        if (n.isBR){
          n.alive = false;
          n.state = "defeated";
          player.kills = (player.kills || 0) + 1;
          S.coins += 100; S.totalCoins += 100;
          spawnParticles(n.x, n.y, "#ffd700", 30);
          checkBRWin();
          updateGoal();
        } else {
          n.state = "defeated";
          if (!n.isBoss) n.defeatedTimer = 90;
          let pts = n.isBoss ? 500 : 10;
          if (S.ownedPowerups.includes("double")) pts *= 2;
          S.coins += pts; S.totalCoins += pts; S.kills++;
          combo++; comboTimer = 90;
          if (combo > S.maxCombo) S.maxCombo = combo;
          spawnParticles(n.x, n.y, "#7ed6a0", 25);
          if (!n.isBoss && Math.random() < 0.4) spawnPrize(n.x, n.y);
          if (n.isBoss){
            S.bossDefeated = true;
            document.getElementById("bossBar").classList.remove("on");
            playBeep("win");
            shakeAmount = Math.max(shakeAmount, 40);
            showDlg("🎉 اژدها کشته شد! 🏆", 5000, 1.6, 1);
          }
          save(); updateHUD(); checkLevelDone();
        }
      }
    }
  });

  const px = player.x + Math.cos(baseAng) * 40;
  const py = player.y + Math.sin(baseAng) * 40;
  for (let i = 0; i < 12; i++){
    const a = baseAng + (Math.random() - 0.5) * spread;
    particles.push({ x: px, y: py, vx: Math.cos(a)*(3+Math.random()*3), vy: Math.sin(a)*(3+Math.random()*3), life: 1, color: "#ffd700", size: 4 + Math.random() * 4 });
  }
}

function spawnPrize(x, y){
  const types = ["health","speed","shield","coin"];
  prizeBoxes.push({ x, y, type: types[Math.floor(Math.random()*types.length)], life: 600, anim: 0 });
}
function collectPrize(b){
  playBeep("coin");
  spawnParticles(b.x, b.y, "#ffd700", 20);
  if (b.type === "coin"){ S.coins += 25; S.totalCoins += 25; showDlg("💰 +25 سکه!", 1500, 1.5, 1); }
  else if (b.type === "health"){ player.health = Math.min(player.maxHealth, player.health + 30); showDlg("❤️ +30 جون!", 1500, 1.5, 1); }
  else if (b.type === "speed"){ player.speedBoost = 600; showDlg("⚡ سرعت!", 1500, 1.5, 1); }
  else if (b.type === "shield"){ player.shieldTimer = 400; showDlg("🛡️ سپر!", 1500, 1.5, 1); }
  updateHUD();
}

function usePotion(){
  const c = S.consumables;
  if (c.potion_health > 0 && player.health < player.maxHealth){
    c.potion_health--; player.health = Math.min(player.maxHealth, player.health + 50);
    spawnParticles(player.x, player.y, "#ff3030", 20);
    showDlg("❤️ +50 جون!", 1500, 1.5, 1);
    updateItem(); updateHUD(); save(); return;
  }
  if (c.potion_speed > 0){
    c.potion_speed--; player.speedBoost = 900;
    spawnParticles(player.x, player.y, "#7fe3ff", 20);
    showDlg("⚡ سرعت!", 1500, 1.5, 1);
    updateItem(); save(); return;
  }
  if (c.potion_shield > 0){
    c.potion_shield--; player.shieldTimer = 600;
    spawnParticles(player.x, player.y, "#4ade80", 20);
    showDlg("🛡️ سپر!", 1500, 1.5, 1);
    updateItem(); save(); return;
  }
  if (c.bomb > 0){
    c.bomb--;
    let k = 0;
    enemies.forEach(n => {
      if (n.state === "defeated") return;
      const d = Math.hypot(n.x - player.x, n.y - player.y);
      if (d < 300){
        n.health = 0; n.state = "defeated"; n.defeatedTimer = 90;
        S.kills++; k++; S.coins += 10;
        spawnParticles(n.x, n.y, "#ff6b00", 20);
      }
    });
    shakeAmount = Math.max(shakeAmount, 30);
    showDlg("💣 " + k + " دشمن نابود شد!", 2000, 1.5, 1);
    updateItem(); updateHUD(); save(); return;
  }
  showDlg("هیچ آیتمی نداری! 💊", 2500, 1.5, 0.9);
}

function updateItem(){
  const c = S.consumables;
  const total = c.potion_health + c.potion_speed + c.potion_shield + c.bomb;
  document.getElementById("itemCnt").textContent = total;
  document.getElementById("item").classList.toggle("on", total > 0);
}

function spawnParticles(x, y, color, count){
  for (let i = 0; i < count; i++){
    particles.push({ x, y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6-2, life: 1, color, size: 3 + Math.random() * 5 });
  }
}
const damageNums = [];
function damagePopup(x, y, value){ damageNums.push({ x, y, value, life: 60 }); }

/* ============================================================
   ============ UPDATE ============
   ============================================================ */
function update(){
  if (!gameStarted) return;
  const input = getInput();
  if (autoMoveTimer > 0 && autoMoveTarget){
    autoMoveTimer--;
    const dx = autoMoveTarget.x - player.x, dy = autoMoveTarget.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 30){ input.x = dx / dist; input.y = dy / dist; }
    else { autoMoveTimer = 0; autoMoveTarget = null; }
  }

  let speed = 4 * playerSpeedMult;
  if (S.ownedPowerups.includes("speed")) speed *= 1.3;
  if (player.speedBoost > 0){ speed *= 1.5; player.speedBoost--; }

  const vx = input.x * speed, vy = input.y * speed;
  if (Math.abs(input.x) > 0.1 || Math.abs(input.y) > 0.1){
    if (Math.abs(input.x) > Math.abs(input.y)) player.dir = input.x > 0 ? 3 : 1;
    else player.dir = input.y > 0 ? 0 : 2;
    player.walkFrame += 0.5;
  }

  let nx = player.x + vx, ny = player.y + vy;
  if (!collides(nx, player.y, player.r)) player.x = nx;
  if (!collides(player.x, ny, player.r)) player.y = ny;
  player.x = Math.max(40, Math.min(world.w - 40, player.x));
  player.y = Math.max(40, Math.min(world.h - 40, player.y));

  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.hitFlash > 0) player.hitFlash--;
  if (player.shieldTimer > 0) player.shieldTimer--;
  if (player.mana < player.maxMana) player.mana = Math.min(player.maxMana, player.mana + 0.2);
  if (S.ownedPowerups.includes("regen") && player.health < player.maxHealth)
    player.health = Math.min(player.maxHealth, player.health + 0.03);

  // Auto oil power
  if (autoOilTimer > 0){
    autoOilTimer--;
    if (autoOilTimer <= 0){
      autoOilTimer = 300;
      const t = nearestNPC();
      if (t){
        const a = Math.atan2(t.y - player.y, t.x - player.x);
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 7, vy: Math.sin(a) * 7, owner: "player", damage: 30 * playerDamageMult, life: 150 });
        playBeep("bullet");
      }
    }
  }

  enemies.forEach(updateEnemy);
  brPlayers.forEach(updateBRPlayer);
  if (boss && boss.health > 0) updateBoss();
  updatePets();
  updateAutoHunt();

  if (comboTimer > 0){ comboTimer--; if (comboTimer <= 0) combo = 0; }

  for (let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0){ bullets.splice(i, 1); continue; }
    if (b.owner === "enemy"){
      if (Math.hypot(b.x - player.x, b.y - player.y) < player.r + 6){
        let dmg = b.damage;
        if (S.ownedPowerups.includes("shield")) dmg *= 0.5;
        if (player.shieldTimer > 0) dmg = 0;
        if (dmg > 0){
          player.health -= dmg;
          player.hitFlash = 8;
          playBeep("hurt");
          spawnParticles(player.x, player.y, "#ff6b6b", 8);
          shakeAmount = Math.max(shakeAmount, 15);
        }
        bullets.splice(i, 1);
        updateHUD();
        if (player.health <= 0){ gameStarted = false; showLevelEnd(false); return; }
        continue;
      }
    } else if (b.owner === "player"){
      // آسیب به دشمن‌ها
      let hit = false;
      enemies.forEach(n => {
        if (n.state === "defeated" || hit) return;
        if (Math.hypot(b.x - n.x, b.y - n.y) < n.r + 6){
          n.health -= b.damage;
          n.hitFlash = 10;
          spawnParticles(n.x, n.y, "#ffb700", 6);
          damagePopup(n.x, n.y - 20, Math.floor(b.damage));
          hit = true;
          if (n.health <= 0 && n.state !== "defeated"){
            n.state = "defeated"; n.defeatedTimer = 90;
            S.coins += 10; S.totalCoins += 10; S.kills++;
            spawnParticles(n.x, n.y, "#7ed6a0", 20);
            save(); updateHUD(); checkLevelDone();
          }
        }
      });
      if (hit){ bullets.splice(i, 1); continue; }
    }
    if (collides(b.x, b.y, 4)) bullets.splice(i, 1);
  }

  for (let i = prizeBoxes.length - 1; i >= 0; i--){
    const b = prizeBoxes[i];
    b.life--; b.anim += 0.1;
    if (b.life <= 0){ prizeBoxes.splice(i, 1); continue; }
    if (Math.hypot(b.x - player.x, b.y - player.y) < player.r + 25){ collectPrize(b); prizeBoxes.splice(i, 1); }
  }

  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i];
    if (Math.hypot(it.x - player.x, it.y - player.y) < player.r + 20){
      S.coins += 100; S.totalCoins += 100;
      playBeep("coin");
      spawnParticles(it.x, it.y, "#ffd700", 30);
      showDlg("💎 +100 سکه!", 2500, 1.6, 1);
      items.splice(i, 1);
      updateHUD();
      break;
    }
  }

  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = damageNums.length - 1; i >= 0; i--){
    damageNums[i].y -= 0.8; damageNums[i].life--;
    if (damageNums[i].life <= 0) damageNums.splice(i, 1);
  }

  updateCamera();
  updateHUD();
}

function updateEnemy(n){
  if (n.state === "defeated"){
    if (n.defeatedTimer > 0){ n.defeatedTimer--; n.y += 0.5; }
    return;
  }
  if (n.hitFlash > 0) n.hitFlash--;

  n.dlgTimer--;
  if (n.dlgTimer <= 0){
    if (Math.hypot(n.x - player.x, n.y - player.y) < 300) speak(ENEMY_LINES[n.dlgIdx], 1.4, 0.95);
    n.dlgTimer = 200 + Math.random() * 200;
    n.dlgIdx = (n.dlgIdx + 1) % ENEMY_LINES.length;
  }

  const dx = player.x - n.x, dy = player.y - n.y;
  const dist = Math.hypot(dx, dy);

  if (dist < 220 && n.state !== "chase"){ n.state = "flee"; n.stateTimer = 60; }
  // گاهی حمله مستقیم
  if (dist < 100 && n.attackCD <= 0){
    n.attackCD = 60;
    player.health -= levelConfig.enemyDamage;
    player.hitFlash = 8;
    playBeep("hurt");
    spawnParticles(player.x, player.y, "#ff6b6b", 8);
    updateHUD();
    if (player.health <= 0){ gameStarted = false; showLevelEnd(false); return; }
  }
  if (n.attackCD > 0) n.attackCD--;

  if (n.hasWeapon && n.weaponCD <= 0 && dist < 350 && dist > 60){
    const a = Math.atan2(dy, dx);
    bullets.push({ x: n.x, y: n.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, owner: "enemy", damage: levelConfig.enemyDamage, life: 120 });
    n.weaponCD = 120 - Math.min(60, level * 3);
    playBeep("bullet");
    n.state = "wander";
  }
  if (n.weaponCD > 0) n.weaponCD--;

  if (n.state === "flee"){
    n.stateTimer--;
    if (n.stateTimer <= 0) n.state = "wander";
    const a = Math.atan2(-dy, -dx);
    const sp = levelConfig.enemySpeed + 1.2;
    let nx = n.x + Math.cos(a) * sp, ny = n.y + Math.sin(a) * sp;
    if (!collides(nx, n.y, n.r)) n.x = nx;
    if (!collides(n.x, ny, n.r)) n.y = ny;
    n.dir = Math.abs(Math.cos(a)) > Math.abs(Math.sin(a)) ? (Math.cos(a) > 0 ? 3 : 1) : (Math.sin(a) > 0 ? 0 : 2);
    n.walkFrame += 0.4;
    n.x = Math.max(40, Math.min(world.w - 40, n.x));
    n.y = Math.max(40, Math.min(world.h - 40, n.y));
    return;
  }

  n.stateTimer--;
  if (n.stateTimer <= 0){
    const room = rooms[Math.floor(Math.random() * rooms.length)];
    const spot = findSafeSpot(room, n.r + 5);
    n.targetX = spot.x; n.targetY = spot.y;
    n.stateTimer = 120 + Math.random() * 120;
  }
  const tdx = n.targetX - n.x, tdy = n.targetY - n.y;
  const td = Math.hypot(tdx, tdy);
  if (td > 10){
    const a = Math.atan2(tdy, tdx);
    const sp = levelConfig.enemySpeed;
    let nx = n.x + Math.cos(a) * sp, ny = n.y + Math.sin(a) * sp;
    if (!collides(nx, n.y, n.r)) n.x = nx; else n.targetX = n.x + (Math.random() - 0.5) * 200;
    if (!collides(n.x, ny, n.r)) n.y = ny; else n.targetY = n.y + (Math.random() - 0.5) * 200;
    n.dir = Math.abs(Math.cos(a)) > Math.abs(Math.sin(a)) ? (Math.cos(a) > 0 ? 3 : 1) : (Math.sin(a) > 0 ? 0 : 2);
    n.walkFrame += 0.25;
  }
}

function updateBoss(){
  if (!boss || boss.health <= 0) return;
  if (boss.hitFlash > 0) boss.hitFlash--;
  const dx = player.x - boss.x, dy = player.y - boss.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 100){
    const a = Math.atan2(dy, dx);
    const sp = 1.2;
    let nx = boss.x + Math.cos(a) * sp, ny = boss.y + Math.sin(a) * sp;
    if (!collides(nx, boss.y, boss.r)) boss.x = nx;
    if (!collides(boss.x, ny, boss.r)) boss.y = ny;
    boss.dir = Math.abs(Math.cos(a)) > Math.abs(Math.sin(a)) ? (Math.cos(a) > 0 ? 3 : 1) : (Math.sin(a) > 0 ? 0 : 2);
    boss.walkFrame += 0.4;
  }
  if (boss.bulletCD <= 0 && dist < 500){
    const baseA = Math.atan2(dy, dx);
    for (let i = -1; i <= 1; i++){
      const a = baseA + i * 0.3;
      bullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, owner: "enemy", damage: 4, life: 120 });
    }
    boss.bulletCD = 60;
    playBeep("boss");
  }
  if (boss.bulletCD > 0) boss.bulletCD--;
  if (boss.slamCD <= 0 && dist < 100){
    shakeAmount = Math.max(shakeAmount, 30);
    player.health -= 15;
    player.hitFlash = 20;
    playBeep("hurt");
    boss.slamCD = 120;
    updateHUD();
    if (player.health <= 0){ gameStarted = false; showLevelEnd(false); return; }
  }
  if (boss.slamCD > 0) boss.slamCD--;
  boss.dlgTimer--;
  if (boss.dlgTimer <= 0){
    const d = ["نمی‌تونی منو بزنی! 🐉", "غررر! 🔥", "مرگ توئه! 💀"];
    speak(d[boss.dlgIdx], 0.6, 0.8);
    boss.dlgIdx = (boss.dlgIdx + 1) % d.length;
    boss.dlgTimer = 300;
  }
  document.getElementById("bossFill").style.width = (boss.health / boss.maxHealth * 100) + "%";
}

function updateCamera(){
  const tx = player.x - W / 2, ty = player.y - H / 2;
  camera.x += (tx - camera.x) * 0.15;
  camera.y += (ty - camera.y) * 0.15;
  if (camera.x < 0) camera.x = 0;
  if (camera.y < 0) camera.y = 0;
  if (camera.x > world.w - W) camera.x = Math.max(0, world.w - W);
  if (camera.y > world.h - H) camera.y = Math.max(0, world.h - H);
  if (shakeAmount > 0){
    camera.sx = (Math.random() - 0.5) * shakeAmount;
    camera.sy = (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.85;
    if (shakeAmount < 0.3) shakeAmount = 0;
  } else { camera.sx = 0; camera.sy = 0; }
}

/* ============================================================
   ============ RENDER ============
   ============================================================ */
function drawChar(x, y, r, dir, wf, bodyCol, hairCol, skinCol, hitFlash, isPlayer, isBR, dead){
  const cx = x - camera.x + camera.sx;
  const cy = y - camera.y + camera.sy;
  if (cx < -100 || cx > W + 100 || cy < -100 || cy > H + 100) return;
  if (dead) return;
  const bob = Math.sin(wf) * 3;
  const py = cy + bob;
  ctx.fillStyle = "rgba(0,0,0,.3)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.9, r * 0.9, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.translate(cx, py);
  let bodyColor = bodyCol, hairColor = hairCol, skinColor = skinCol;
  if (hitFlash > 0){ bodyColor = "#fff"; hairColor = "#ff6666"; }
  const legOff = Math.sin(wf) * 5;
  ctx.fillStyle = "#5a3a1a";
  ctx.beginPath(); ctx.ellipse(-r*0.35, r*0.6 + legOff*0.2, r*0.2, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.35, r*0.6 - legOff*0.2, r*0.2, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.ellipse(0, r*0.15, r*0.65, r*0.75, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 2; ctx.stroke();
  if (isPlayer && S.equipArmor !== "none"){
    ctx.strokeStyle = "#c0c0c0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, r*0.15, r*0.72, r*0.82, 0, 0, Math.PI*2); ctx.stroke();
  }
  if (isPlayer && player.shieldTimer > 0){
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, r*1.4, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = skinColor;
  ctx.beginPath(); ctx.ellipse(-r*0.75, r*0.1 + legOff*0.3, r*0.18, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r*0.75, r*0.1 - legOff*0.3, r*0.18, r*0.35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = skinColor;
  ctx.beginPath(); ctx.arc(0, -r*0.55, r*0.7, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.stroke();
  ctx.fillStyle = hairColor;
  if (isPlayer){
    ctx.beginPath(); ctx.arc(0, -r*0.55, r*0.72, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillRect(-r*0.72, -r*0.55, r*0.2, r*0.9);
    ctx.fillRect(r*0.52, -r*0.55, r*0.2, r*0.9);
    ctx.strokeStyle = "#3a1a00"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-r*0.28, -r*0.55, r*0.22, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(r*0.28, -r*0.55, r*0.22, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r*0.06, -r*0.55); ctx.lineTo(r*0.06, -r*0.55); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, -r*0.7, r*0.7, Math.PI, Math.PI*2); ctx.fill();
  }
  let ex1 = -r*0.22, ex2 = r*0.22, ey = -r*0.55;
  if (dir === 1){ ex1 = -r*0.35; ex2 = -r*0.05; }
  if (dir === 3){ ex1 = r*0.05; ex2 = r*0.35; }
  if (dir === 2){ ey = -r*0.65; }
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(ex1, ey, r*0.13, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey, r*0.13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.arc(ex1, ey, r*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ex2, ey, r*0.06, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#7a1a10"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -r*0.35, r*0.15, 0, Math.PI); ctx.stroke();
  if (isPlayer){
    const w = getWeapon();
    ctx.save();
    ctx.translate(r*0.7, r*0.15);
    if (w.id === "oil"){
      ctx.fillStyle = "#ffb700";
      ctx.fillRect(-r*0.18, -r*0.35, r*0.36, r*0.7);
      ctx.strokeStyle = "#8a5a00"; ctx.lineWidth = 2;
      ctx.strokeRect(-r*0.18, -r*0.35, r*0.36, r*0.7);
    } else {
      ctx.font = r*0.9 + "px serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(w.icon, 0, 0);
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawEnemy(n){
  if (n.state === "defeated" && n.defeatedTimer <= 0) return;
  drawChar(n.x, n.y, n.r, n.dir, n.walkFrame, n.color, "#3a1a0a", "#ffd8b0", n.hitFlash, false, false, false);
  if (n.hasWeapon && n.state !== "defeated"){
    const cx = n.x - camera.x + camera.sx;
    const cy = n.y - camera.y + camera.sy + Math.sin(n.walkFrame) * 3;
    ctx.font = n.r * 0.7 + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🔫", cx + n.r * 0.7, cy);
  }
  if (n.state !== "defeated"){
    const cx = n.x - camera.x + camera.sx;
    const cy = n.y - camera.y + camera.sy - n.r * 1.9;
    const bw = n.r * 2, bh = 5;
    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(cx - n.r, cy, bw, bh);
    const hp = Math.max(0, n.health / n.maxHealth);
    ctx.fillStyle = hp > 0.5 ? "#4ade80" : hp > 0.25 ? "#ffd700" : "#ff3030";
    ctx.fillRect(cx - n.r, cy, bw * hp, bh);
    ctx.fillStyle = "#ffb700";
    ctx.fillRect(cx - n.r, cy + bh + 1, bw * (n.oilLevel / 100), 3);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "bold 10px Tahoma"; ctx.textAlign = "center";
    ctx.fillText(n.name, cx, cy - 4);
  }
}

function drawBRPlayer(n){
  if (!n.alive) return;
  drawChar(n.x, n.y, n.r, n.dir, n.walkFrame, n.color, "#3a1a0a", "#ffd8b0", n.hitFlash, false, true, false);
  const cx = n.x - camera.x + camera.sx;
  const cy = n.y - camera.y + camera.sy - n.r * 1.9;
  const bw = n.r * 2, bh = 5;
  ctx.fillStyle = "rgba(0,0,0,.7)";
  ctx.fillRect(cx - n.r, cy, bw, bh);
  const hp = Math.max(0, n.health / n.maxHealth);
  ctx.fillStyle = hp > 0.5 ? "#4ade80" : hp > 0.25 ? "#ffd700" : "#ff3030";
  ctx.fillRect(cx - n.r, cy, bw * hp, bh);
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.font = "bold 10px Tahoma"; ctx.textAlign = "center";
  ctx.fillText(n.name, cx, cy - 4);
}

function drawBoss(){
  if (!boss || boss.health <= 0) return;
  const cx = boss.x - camera.x + camera.sx;
  const cy = boss.y - camera.y + camera.sy;
  drawChar(boss.x, boss.y, boss.r, boss.dir, boss.walkFrame, "#8a0000", "#4a0000", "#8a2020", boss.hitFlash, false, false, false);
  ctx.font = "40px serif"; ctx.textAlign = "center";
  ctx.fillText("🐉", cx, cy - boss.r * 1.5);
}

function drawPets(){
  pets.forEach(p => {
    const px = p.x - camera.x + camera.sx;
    const py = p.y - camera.y + camera.sy;
    ctx.font = "36px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(p.icon, px, py);
  });
}

function drawMap(){
  ctx.fillStyle = "#1a1a2a";
  ctx.fillRect(0, 0, W, H);
  rooms.forEach(r => {
    const rx = r.x - camera.x + camera.sx, ry = r.y - camera.y + camera.sy;
    if (rx > W || ry > H || rx + r.w < 0 || ry + r.h < 0) return;
    ctx.fillStyle = r.floor;
    ctx.fillRect(rx, ry, r.w, r.h);
    ctx.strokeStyle = "rgba(0,0,0,.05)"; ctx.lineWidth = 1;
    for (let x = 0; x < r.w; x += 60){ ctx.beginPath(); ctx.moveTo(rx + x, ry); ctx.lineTo(rx + x, ry + r.h); ctx.stroke(); }
    for (let y = 0; y < r.h; y += 60){ ctx.beginPath(); ctx.moveTo(rx, ry + y); ctx.lineTo(rx + r.w, ry + y); ctx.stroke(); }
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.font = "bold 16px Tahoma"; ctx.textAlign = "center";
    ctx.fillText(r.name, rx + r.w / 2, ry + 25);
    const icons = { tv:"📺", kitchen:"🍳", bath:"🚽", bed:"💐", gym:"🥋", oil:"🛢️", kids:"🧸", storage:"📦", yard:"🌳" };
    if (icons[r.deco]){ ctx.font = "40px serif"; ctx.fillText(icons[r.deco], rx + r.w / 2, ry + r.h / 2 + 15); }
  });
  obstacles.forEach(o => {
    const ox = o.x - camera.x + camera.sx, oy = o.y - camera.y + camera.sy;
    if (ox > W || oy > H || ox + o.w < 0 || oy + o.h < 0) return;
    if (o.color){
      ctx.fillStyle = o.color;
      ctx.fillRect(ox, oy, o.w, o.h);
      ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 2;
      ctx.strokeRect(ox, oy, o.w, o.h);
    } else {
      ctx.fillStyle = "#5a3a1a";
      ctx.fillRect(ox, oy, o.w, o.h);
      ctx.fillStyle = "rgba(255,255,255,.08)";
      ctx.fillRect(ox + 3, oy + 3, o.w - 6, 6);
      ctx.fillStyle = "rgba(0,0,0,.3)";
      ctx.fillRect(ox, oy + o.h - 6, o.w, 6);
    }
  });
}

function drawPrizesItems(){
  prizeBoxes.forEach(b => {
    const bx = b.x - camera.x + camera.sx, by = b.y - camera.y + camera.sy + Math.sin(b.anim) * 3;
    if (bx < -50 || bx > W + 50 || by < -50 || by > H + 50) return;
    const grad = ctx.createRadialGradient(bx, by, 0, bx, by, 30);
    grad.addColorStop(0, "rgba(255,215,0,.9)");
    grad.addColorStop(1, "rgba(255,215,0,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(bx, by, 30, 0, Math.PI * 2); ctx.fill();
    const icons = { health:"❤️", speed:"⚡", shield:"🛡️", coin:"💰" };
    ctx.font = "30px serif"; ctx.textAlign = "center";
    ctx.fillText(icons[b.type] || "🎁", bx, by + 10);
  });
  items.forEach(it => {
    const ix = it.x - camera.x + camera.sx, iy = it.y - camera.y + camera.sy;
    if (ix < -50 || ix > W + 50 || iy < -50 || iy > H + 50) return;
    const grad = ctx.createRadialGradient(ix, iy, 0, ix, iy, 40);
    grad.addColorStop(0, "rgba(127,227,255,.9)");
    grad.addColorStop(1, "rgba(127,227,255,0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(ix, iy, 40, 0, Math.PI * 2); ctx.fill();
    ctx.font = "36px serif"; ctx.textAlign = "center";
    ctx.fillText("💎", ix, iy + 12);
  });
}

function drawBullets(){
  bullets.forEach(b => {
    const bx = b.x - camera.x + camera.sx, by = b.y - camera.y + camera.sy;
    ctx.fillStyle = b.owner === "enemy" ? "#ff6b6b" : "#7fe3ff";
    ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  });
}

function drawParticlesArr(){
  particles.forEach(p => {
    const px = p.x - camera.x + camera.sx, py = p.y - camera.y + camera.sy;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(px, py, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawDamageNums(){
  ctx.font = "bold 20px Tahoma"; ctx.textAlign = "center";
  damageNums.forEach(d => {
    const dx = d.x - camera.x + camera.sx, dy = d.y - camera.y + camera.sy;
    ctx.globalAlpha = d.life / 60;
    ctx.fillStyle = "#ffd700"; ctx.strokeStyle = "#3a1a00"; ctx.lineWidth = 3;
    ctx.strokeText("-" + d.value, dx, dy);
    ctx.fillText("-" + d.value, dx, dy);
  });
  ctx.globalAlpha = 1;
}

function drawCrosshair(){
  if (!gameStarted) return;
  if (player.attackCooldown > 10) return;
  const cx = player.x - camera.x + camera.sx;
  const cy = player.y - camera.y + camera.sy;
  const dirAng = [Math.PI/2, Math.PI, -Math.PI/2, 0];
  const a = dirAng[player.dir];
  const w = getWeapon();
  ctx.save();
  ctx.globalAlpha = autoHunt ? 0.35 : 0.15;
  ctx.fillStyle = autoHunt ? "#ff6b00" : "#ffd700";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, w.range, a - Math.PI / 7, a + Math.PI / 7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function render(){
  drawMap();
  drawPrizesItems();
  enemies.forEach(drawEnemy);
  brPlayers.forEach(drawBRPlayer);
  drawBoss();
  drawPets();

  let bodyCol = "#8a4858";
  if (S.equipSkin === "ninja") bodyCol = "#1a1a2a";
  else if (S.equipSkin === "superhero") bodyCol = "#e74c3c";
  else if (S.equipSkin === "pirate") bodyCol = "#2c3e50";
  else if (S.equipSkin === "doktor") bodyCol = "#ffffff";

  drawChar(player.x, player.y, player.r, player.dir, player.walkFrame, bodyCol, "#5a3a5a", "#e8b088", player.hitFlash, true, false, false);
  drawBullets();
  drawCrosshair();
  drawParticlesArr();
  drawDamageNums();

  if (player.hitFlash > 0){
    ctx.fillStyle = `rgba(255,0,0,${player.hitFlash / 40})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (autoHunt){
    ctx.strokeStyle = "rgba(255,100,0,.6)";
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W - 6, H - 6);
  }
  if (combo > 1){
    ctx.font = "bold 32px Tahoma"; ctx.textAlign = "center";
    ctx.fillStyle = "#ffd700"; ctx.strokeStyle = "#3a1a00"; ctx.lineWidth = 4;
    ctx.strokeText("کمبو x" + combo, W / 2, 140);
    ctx.fillText("کمبو x" + combo, W / 2, 140);
  }
}

/* ============================================================
   ============ MINIMAP ============
   ============================================================ */
const miniC = document.getElementById("miniC");
const mctx = miniC.getContext("2d");
const MM_W = 200, MM_H = 160;
function drawMini(){
  mctx.fillStyle = "rgba(0,0,0,.85)";
  mctx.fillRect(0, 0, MM_W, MM_H);
  const sx = MM_W / world.w, sy = MM_H / world.h;
  rooms.forEach(r => {
    mctx.fillStyle = "rgba(120,80,40,.6)";
    mctx.fillRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy);
    mctx.strokeStyle = "rgba(255,215,0,.4)";
    mctx.lineWidth = 1;
    mctx.strokeRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy);
  });
  enemies.forEach(n => {
    if (n.state === "defeated") return;
    mctx.fillStyle = autoHunt ? "#ff6b00" : "#ff6b6b";
    mctx.beginPath(); mctx.arc(n.x * sx, n.y * sy, 3, 0, Math.PI * 2); mctx.fill();
  });
  brPlayers.forEach(n => {
    if (!n.alive) return;
    mctx.fillStyle = "#ff8ac4";
    mctx.beginPath(); mctx.arc(n.x * sx, n.y * sy, 3, 0, Math.PI * 2); mctx.fill();
  });
  if (boss && boss.health > 0){
    mctx.fillStyle = "#8a0000";
    mctx.beginPath(); mctx.arc(boss.x * sx, boss.y * sy, 6, 0, Math.PI * 2); mctx.fill();
    mctx.strokeStyle = "#ffd700"; mctx.lineWidth = 2; mctx.stroke();
  }
  mctx.fillStyle = "#ffd700";
  mctx.beginPath(); mctx.arc(player.x * sx, player.y * sy, 4, 0, Math.PI * 2); mctx.fill();
  mctx.strokeStyle = "#fff"; mctx.lineWidth = 1; mctx.stroke();
}

   ============ HUD ============================================
   ============================================================ */
function updateHUD(){
  const hpPct = (player.health / player.maxHealth) * 100;
  document.getElementById("hpFill").style.width = hpPct + "%";
  document.getElementById("hpTxt").textContent = `❤️ ${Math.round(player.health)}/${player.maxHealth}`;
  document.getElementById("mpFill").style.width = (player.mana / player.maxMana * 100) + "%";
  document.getElementById("coins").textContent = S.coins;
  document.getElementById("shopCoins").textContent = S.coins;
}

/* ============================================================
   ============ LEVEL END ============
   ============================================================ */
function checkLevelDone(){
  updateGoal();
  if (gameMode === MODES.BATTLE_ROYALE) return;
  const alive = enemies.filter(e => e.state !== "defeated").length;
  if (alive === 0 && (!boss || boss.health <= 0) && !levelComplete){
    levelComplete = true;
    stopAutoHunt();
    setTimeout(() => showLevelEnd(true), 1000);
  }
}

function showLevelEnd(victory){
  const e = document.getElementById("lvlEnd");
  const elapsed = Math.round((Date.now() - levelStartTime) / 1000);
  document.getElementById("endEmoji").textContent = victory ? "🎉" : "😵";
  let title = "مرحله " + level + " تموم شد!";
  if (gameMode === MODES.BATTLE_ROYALE) title = victory ? "🏆 برنده شدی!" : "باختی!";
  else if (gameMode === MODES.ENDLESS) title = victory ? "🌊 موج " + level + " تموم شد!" : "موج خیلی سخت بود!";
  else title = victory ? "مرحله " + level + " تموم شد!" : "بی‌بی خسته شد!";
  document.getElementById("endTitle").textContent = title;
  document.getElementById("endMsg").textContent = victory ? "همه روغن‌کاری شدن!" : "دوباره تلاش کن!";
  document.getElementById("endCoins").textContent = S.coins;
  document.getElementById("endTime").textContent = "⏱️ " + elapsed + " ثانیه";
  const nxt = document.getElementById("nextBtn");
  if (gameMode === MODES.ADVENTURE && level >= 60){
    nxt.textContent = "🎊 تموم شد!";
    nxt.disabled = true;
  } else {
    nxt.textContent = "مرحله بعد ➡️";
    nxt.disabled = false;
  }
  e.classList.add("on");
  save();
}

function nextLevel(){
  document.getElementById("lvlEnd").classList.remove("on");
  if (gameMode === MODES.ADVENTURE){
    if (level >= 60) return;
    level++;
    S.advLevel = level;
    if (level > S.maxLevel) S.maxLevel = level;
    save();
    startLevel(level, false, false);
  } else if (gameMode === MODES.BATTLE_ROYALE){
    level = 1;
    startLevel(1, true, false);
  } else {
    // حالت بی‌نهایت - انتخاب قدرت
    showPowerSelection();
  }
}

/* ============================================================
   ============ SHOP ============
   ============================================================ */
let shopTab = "weapons";
function renderShop(){
  document.getElementById("shopCoins").textContent = S.coins;
  const cont = document.getElementById("shopItems");
  cont.innerHTML = "";
  let arr, owned, equipped;
  if (shopTab === "weapons"){ arr = SHOP_WEAPONS; owned = S.ownedWeapons; equipped = S.equipWeapon; }
  else if (shopTab === "armor"){ arr = SHOP_ARMOR; owned = S.ownedArmors; equipped = S.equipArmor; }
  else if (shopTab === "skins"){ arr = SHOP_SKINS; owned = S.ownedSkins; equipped = S.equipSkin; }
  else if (shopTab === "powerups"){ arr = SHOP_POWERUPS; owned = S.ownedPowerups; equipped = ""; }
  else { arr = SHOP_CONSUMABLES; owned = []; equipped = ""; }
  arr.forEach(it => {
    const isCons = shopTab === "consumables";
    const isOwned = isCons ? (S.consumables[it.id] || 0) > 0 : owned.includes(it.id);
    const isEq = !isCons && equipped === it.id;
    const card = document.createElement("div");
    card.className = "sItem" + (isOwned && !isCons ? " owned" : "") + (isEq ? " equip" : "");
    card.innerHTML = `
      <div class="ic">${it.icon}</div>
      <div class="nm">${it.name}</div>
      <div class="ds">${it.desc}</div>
      ${it.price > 0 ? `<div class="pr">🪙 ${it.price}${isCons && isOwned ? ' (دارید: ' + S.consumables[it.id] + ')' : ''}</div>` : ""}
    `;
    const btn = document.createElement("button");
    btn.addEventListener("click", e => {
      e.stopPropagation();
      handleShopClick(it, isCons, isOwned, isEq);
    });
    btn.textContent = isCons
      ? (S.coins >= it.price ? "بخر" : "سکه کمه")
      : (isOwned ? (isEq ? "✓ انتخاب شده" : "انتخاب کن") : (S.coins >= it.price ? "بخر" : "سکه کمه"));
    btn.disabled = isCons ? S.coins < it.price : (isOwned ? isEq : S.coins < it.price);
    card.appendChild(btn);
    cont.appendChild(card);
  });
}

function handleShopClick(it, isCons, isOwned, isEq){
  if (isCons){
    if (S.coins >= it.price){
      S.coins -= it.price;
      S.consumables[it.id] = (S.consumables[it.id] || 0) + 1;
      save(); renderShop(); updateHUD(); updateItem();
      showDlg("خریداری شد! " + it.icon, 1500, 1.5, 1);
    }
    return;
  }
  if (isOwned){
    if (shopTab === "weapons") S.equipWeapon = it.id;
    else if (shopTab === "armor"){ S.equipArmor = it.id; updatePlayerStats(); }
    else if (shopTab === "skins") S.equipSkin = it.id;
    save(); renderShop();
    return;
  }
  if (S.coins >= it.price){
    S.coins -= it.price;
    if (shopTab === "weapons") S.ownedWeapons.push(it.id);
    else if (shopTab === "armor") S.ownedArmors.push(it.id);
    else if (shopTab === "skins") S.ownedSkins.push(it.id);
    else if (shopTab === "powerups") S.ownedPowerups.push(it.id);
    save(); renderShop(); updateHUD();
    showDlg("خریداری شد! " + it.icon, 1500, 1.5, 1);
  }
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
    tab.classList.add("on");
    shopTab = tab.dataset.t;
    renderShop();
  });
});

function openShop(){
  document.getElementById("shopPanel").classList.add("on");
  document.getElementById("closeShop").classList.add("on");
  renderShop();
}
function closeShop(){
  document.getElementById("shopPanel").classList.remove("on");
  document.getElementById("closeShop").classList.remove("on");
}
document.getElementById("closeShop").addEventListener("click", closeShop);
document.getElementById("endShopBtn").addEventListener("click", () => {
  document.getElementById("lvlEnd").classList.remove("on");
  openShop();
});

/* ============================================================
   ============ BUTTONS ============
   ============================================================ */
const atkBtn = document.getElementById("atk");
atkBtn.addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); attack(); });
atkBtn.addEventListener("click", e => { e.stopPropagation(); });

const voiceBtn = document.getElementById("voice");
voiceBtn.addEventListener("pointerdown", e => {
  e.stopPropagation(); e.preventDefault();
  if (listening) stopListening(); else startListening();
});
voiceBtn.addEventListener("click", e => { e.stopPropagation(); });

const shopBtn = document.getElementById("shop");
shopBtn.addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); openShop(); });
shopBtn.addEventListener("click", e => { e.stopPropagation(); });

const itemBtn = document.getElementById("item");
itemBtn.addEventListener("pointerdown", e => { e.stopPropagation(); e.preventDefault(); usePotion(); });
itemBtn.addEventListener("click", e => { e.stopPropagation(); });

const sndBtn = document.getElementById("snd");
sndBtn.addEventListener("click", e => {
  e.stopPropagation();
  soundOn = !soundOn;
  sndBtn.textContent = soundOn ? "🔊" : "🔇";
  sndBtn.classList.toggle("off", !soundOn);
  initAudio();
});

const menuBtn = document.getElementById("menu");
menuBtn.addEventListener("click", e => {
  e.stopPropagation();
  document.getElementById("menuPanel").classList.toggle("on");
});
document.getElementById("mHelp").addEventListener("click", () => {
  showDlg("جوی‌استیک: نیمه چپ | 🛢️: حمله | 🎤: صوتی | 🏪: فروشگاه", 5000, 1.4, 0.9);
  document.getElementById("menuPanel").classList.remove("on");
});
document.getElementById("mMainMenu").addEventListener("click", () => {
  document.getElementById("menuPanel").classList.remove("on");
  gameStarted = false;
  document.getElementById("mainMenu").classList.remove("off");
  document.getElementById("lvlInfo").classList.remove("on");
  document.getElementById("bossBar").classList.remove("on");
});
document.getElementById("mReset").addEventListener("click", () => {
  if (confirm("مطمئنی؟ همه پیشرفتت پاک می‌شه!")){
    localStorage.removeItem("bibi_v4");
    location.reload();
  }
});

document.getElementById("nextBtn").addEventListener("click", nextLevel);

/* Main Menu buttons */
document.getElementById("modeAdv").addEventListener("click", () => {
  gameMode = MODES.ADVENTURE;
  document.getElementById("mainMenu").classList.add("off");
  document.getElementById("startTitle").textContent = "حالت ماجراجویی";
  document.getElementById("startDesc").innerHTML = "۶۰ مرحله پیش رو داری!<br><b style='color:#ffd700'>🕹️ نیمه چپ: حرکت</b><br><b style='color:#ff9e4a'>🛢️: حمله</b>";
  document.getElementById("start").classList.remove("off");
});
document.getElementById("modeBR").addEventListener("click", () => {
  gameMode = MODES.BATTLE_ROYALE;
  document.getElementById("mainMenu").classList.add("off");
  document.getElementById("startTitle").textContent = "بتل رویال";
  document.getElementById("startDesc").innerHTML = "با ۹ رقیب بجنگ!<br>آخرین نفر برنده است!<br><b style='color:#ffd700'>🕹️ نیمه چپ: حرکت</b>";
  document.getElementById("start").classList.remove("off");
});
document.getElementById("modeEnd").addEventListener("click", () => {
  gameMode = MODES.ENDLESS;
  document.getElementById("mainMenu").classList.add("off");
  document.getElementById("startTitle").textContent = "حالت بی‌نهایت";
  document.getElementById("startDesc").innerHTML = "موج‌های نامحدود!<br>بعد از هر موج قدرت انتخاب کن!<br><b style='color:#ffd700'>🕹️ نیمه چپ: حرکت</b>";
  document.getElementById("start").classList.remove("off");
});

document.getElementById("startBtn").addEventListener("click", () => {
  initAudio();
  document.getElementById("start").classList.add("off");
  gameStarted = true;
  updatePlayerStats();
  player.health = player.maxHealth;
  startGame();
});

/* ============================================================
   ============ GAME LOOP ============
   ============================================================ */
let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;
  update();
  render();
  drawMini();
  requestAnimationFrame(loop);
}

if ("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = () => findFaVoice();
  findFaVoice();
}
buildLevel(1, false, false);
updatePlayerStats();
updateHUD();
updateItem();
requestAnimationFrame(loop);

})();
</script>
